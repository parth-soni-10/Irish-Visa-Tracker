<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset password · Irish Visa Decision Tracker</title>
  <style>
    :root { color-scheme: light; --ink: #1f2937; --muted: #5b6572; --green: #047857; --border: #d9dee5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f8; color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; }
    main { width: min(440px, 92vw); background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 18px 50px rgba(20, 35, 50, .08); }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { color: var(--muted); }
    label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
    button { margin-top: 18px; width: 100%; border: 0; border-radius: 8px; padding: 12px; background: var(--green); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { min-height: 22px; margin-top: 14px; font-size: 13px; }
    a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <p id="intro">Enter a new password for your account.</p>
    <form id="reset-form" novalidate>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit" id="submit">Reset password</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <p><a href="/">Back to the tracker</a></p>
  </main>
  <script>
    (function () {
      var token = new URLSearchParams(location.search).get('token') || '';
      var form = document.getElementById('reset-form');
      var status = document.getElementById('status');
      var button = document.getElementById('submit');
      if (!token) {
        document.getElementById('intro').textContent = 'This reset link is missing its token. Request a new link from the sign-in dialog.';
        form.hidden = true;
        return;
      }
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var password = document.getElementById('password').value;
        var confirm = document.getElementById('confirm').value;
        if (password !== confirm) {
          status.textContent = 'The passwords do not match.';
          status.style.color = '#b91c1c';
          return;
        }
        button.disabled = true;
        status.textContent = 'Saving…';
        status.style.color = '';
        try {
          var response = await fetch('/api/auth/password/reset/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: password })
          });
          var data = await response.json().catch(function () { return {}; });
          if (!response.ok) throw new Error(data.error || 'Could not reset password');
          form.hidden = true;
          document.getElementById('intro').textContent = 'Your password has been reset. You can now sign in.';
          status.textContent = '';
        } catch (error) {
          status.textContent = error.message;
          status.style.color = '#b91c1c';
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
