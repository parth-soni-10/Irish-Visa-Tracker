# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages dev .           → local test on http://localhost:8788
#   npx wrangler pages deploy          → publish .pages-dist to the project
#
# There is no Worker config and no Worker. What answers a form POST or serves
# `data/` is a Pages Function: `functions/[[path]].js` catches every request and
# hands it to `functions/_router.js`. Pages compiles those files as part of the
# deploy, so nothing is bundled here, there is no `_worker.js` to stage, and
# `wrangler deploy` is not a command this repository has any use for.
#
# `pages_build_output_dir` names the upload tools/deploy-pages.mjs stages from
# this repository (the repository root, minus `.assetsignore`), and `_headers`
# carries the response headers - the old netlify.toml is gone, since Cloudflare
# ignored it and every directive it held is in there now.

name = "irishvisaupdatetracker"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# Web Push (functions/push.js -> web-push) signs VAPID requests with JWS,
# which imports Node's stream/util/crypto built-ins. The nodejs_compat flag
# supplies those; every other handler still uses only fetch, D1 and assets.
compatibility_flags = ["nodejs_compat"]

# Note: Cron triggers for scheduled scraping are not supported in Pages Functions.
# Scheduled scraping should be handled via:
# 1. GitHub Actions workflow (.github/workflows/ml-retrain.yml) for ML retraining
# 2. External cron service (cron-job.org, etc.) calling the scraper endpoints
# 3. Separate Cloudflare Worker with Cron Triggers for scraping

# The submissions store: the `submissions` table the handler creates lazily
# (schema.sql is a reference copy).
[[d1_databases]]
binding = "DB"
database_name = "irish-visa-tracker-submissions"
database_id = "d7dc618b-1d18-463c-80d0-c9f4d0b9e6ab"
