name: Daily Telegram Digest

# Posts the one-message morning summary (visa decisions + 1G + permits) to
# Telegram. Needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID repo secrets — see
# the setup steps in digest.py. Without them the job prints SKIP and exits 0.

on:
  workflow_dispatch: {}   # manual "Run workflow" button — still available for on-demand runs
  schedule:
    # Daily 12:30 IST (07:00 UTC) — after all morning scrapes have landed.
    - cron: '0 7 * * *'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python digest.py
