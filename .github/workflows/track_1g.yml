name: Track Stamp 1G Processing Date

on:
  workflow_dispatch: {}   # manual "Run workflow" button — still available for on-demand runs
  schedule:
    # Daily 08:30 IST (03:00 UTC) — one observation per day for the dashboard's
    # advancement-rate + ETA projections. track_1g.py skips when the run date
    # is already recorded, so re-runs and overlap are safe.
    - cron: '0 3 * * *'

jobs:
  track-1g:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/stamp_1g.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Stamp 1G tracker
        run: python track_1g.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stamp_1g.json
          git diff --staged --quiet || git commit -m "1G: record $(date -u +%F) processing date"
          git push
