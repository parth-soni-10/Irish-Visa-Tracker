name: Build verification

# Cloudflare Pages builds and deploys this repository through its Git
# integration, so this workflow only proves the static build still succeeds.
# It used to carry a wrangler deploy step that was skipped on every run because
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID were never configured, which
# made a green check mean less than it appeared to.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Verify static build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Verify Node.js version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Verify build output
        run: ls -la .pages-dist/ && test -d .pages-dist && test -f .pages-dist/index.html
