name: Build verification

# Cloudflare Pages builds and deploys this repository through its Git
# integration, so this workflow only proves the static build still succeeds.
# It used to carry a wrangler deploy step that was skipped on every run because
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID were never configured, which
# made a green check mean less than it appeared to.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages-build-verification
  cancel-in-progress: true

jobs:
  build:
    name: Verify static build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Verify Node.js version
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Verify build output
        run: ls -la .pages-dist/ && test -d .pages-dist && test -f .pages-dist/index.html && test -f .pages-dist/404-internal.html && test -f .pages-dist/build-info.json && test -f .pages-dist/data/search_fallback.json

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: .pages-dist
          if-no-files-found: error
          include-hidden-files: true

  verify-production:
    name: Verify production serves this commit
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: .pages-dist

      # A newer scraper or code push can replace production while this older
      # run is still waiting. Do not make an obsolete build chase a moving
      # target; the workflow for the newer commit owns verification.
      - name: Check this is still the main commit
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read origin/main from the remote."
            exit 1
          fi
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "origin/main moved to $current; skipping production verification for this superseded commit."
          fi

      - name: Wait for production and compare artifacts
        if: steps.tip.outputs.current == 'true'
        env:
          VERIFY_BASE_URL: ${{ vars.APP_BASE_URL || 'https://irishvisaupdatetracker.pages.dev' }}
          VERIFY_COMMIT: ${{ github.sha }}
          VERIFY_TIMEOUT_MS: '300000'
          VERIFY_SETTLE_MS: '120000'
          VERIFY_INTERVAL_MS: '10000'
        run: node tools/verify-deploy.mjs

      - name: Smoke-test production
        if: steps.tip.outputs.current == 'true'
        env:
          SMOKE_BASE_URL: ${{ vars.APP_BASE_URL || 'https://irishvisaupdatetracker.pages.dev' }}
          SMOKE_EXPECT_COMMIT: ${{ github.sha }}
        run: node tools/smoke-deploy.mjs
