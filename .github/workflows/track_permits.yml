name: Track Employment Permit Dates

# Daily snapshot of DETE employment-permit processing dates into
# data/work_permits.json (same schema as data/stamp_1g.json, so the
# dashboard reuses its rendering + projection code).

on:
  workflow_dispatch: {}   # manual "Run workflow" button - still available for on-demand runs
  schedule:
    # One observation per day, right after the 1G run. The script skips when
    # the run date is already recorded, so re-runs and overlap are safe.
    #
    # Same four-attempts-off-the-hour spread as track_1g.yml: GitHub's scheduled
    # runs on this repo have been landing 6-9 hours late, and track_permits.py
    # can only ever write its own run date, so a dropped day is lost for good.
    - cron: '22 2 * * *'
    - cron: '5 3 * * *'   # the original 08:35 IST slot, kept as the nominal one
    - cron: '28 5 * * *'
    - cron: '46 7 * * *'

jobs:
  track-permits:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/work_permits.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run permits tracker
        run: python track_permits.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/work_permits.json
          git diff --staged --quiet || git commit -m "permits: record $(date -u +%F) processing dates"
          # Retry on top of a rebase: a push rejected by a concurrent scrape
          # commit would otherwise fail the job and drop the day's snapshot.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            sleep 5
          done
          echo "::error::could not push data/work_permits.json after 5 attempts"
          exit 1
