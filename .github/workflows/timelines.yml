name: Sync Community Timelines

# Nightly pull of the "timelines-visa" + "timelines-1g" submissions into
# data/community_timelines.json. Since the site moved to a Worker the forms
# post to D1, and the Worker serves those rows back at
# GET /api/community-submissions, so this reads the site itself: no secret, no
# token, nothing to configure. (It used to query D1's API with a
# CLOUDFLARE_API_TOKEN repo secret — one that was never created, and whose
# absence made the job print SKIP and exit 0, leaving the community panels
# empty with nothing anywhere saying why.)

on:
  workflow_dispatch: {}   # manual "Run workflow" button — still available for on-demand runs
  schedule:
    # Nightly 01:00 IST (19:30 UTC previous day) — quiet hour, nothing else runs.
    - cron: '30 19 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/community_timelines.json back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync timelines
        run: python sync_timelines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community_timelines.json
          git diff --staged --quiet || git commit -m "timelines: sync community submissions $(date -u +%F)"
          # Retry on top of a rebase: the scrape workflow commits every ~30
          # minutes, and a rejected push here would drop the whole night's
          # submissions until tomorrow's run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            sleep 5
          done
          echo "::error::could not push data/community_timelines.json after 5 attempts"
          exit 1
