name: Sync Community Timelines

# Nightly pull of "timelines" Netlify Form submissions into
# data/community_timelines.json. Needs NETLIFY_TOKEN + NETLIFY_SITE_ID
# repo secrets — see the setup steps in sync_timelines.py. Without them
# the job prints SKIP and exits 0.

on:
  workflow_dispatch: {}   # manual "Run workflow" button — still available for on-demand runs
  schedule:
    # Nightly 01:00 IST (19:30 UTC previous day) — quiet hour, nothing else runs.
    - cron: '30 19 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/community_timelines.json back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync timelines
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python sync_timelines.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community_timelines.json
          git diff --staged --quiet || git commit -m "timelines: sync community submissions $(date -u +%F)"
          git push
