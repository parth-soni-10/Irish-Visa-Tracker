name: Scrape Visa Decisions

on:
  workflow_dispatch: {}   # manual "Run workflow" button - still available for on-demand runs
  # One poll per publication window, just after it closes, so a file that
  # lands anywhere in its office's window is caught the same day. Windows come
  # from shared/publication-schedule.js; the old 30-minute ladder polled mostly
  # before New Delhi's window and multiplied no-file runs, commit races and
  # notifications.
  schedule:
    - cron: '30 6 * * 1-5'   # New Delhi window closes (05:30–06:30 UTC, weekdays)
    - cron: '0 8 * * 0,2,5,6' # Dublin Tue, Abu Dhabi Fri, Abuja Sat, Ankara Sun (06:00–08:00 UTC)
    # Beijing has no fixed schedule; whichever run follows a snapshot catches it.

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/*.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Run scraper
        run: python scraper.py
        env:
          # Optional out-of-band alert for the gap alert (Slack/Discord/generic
          # webhook - see ALERT_WEBHOOK_URL in scraper.py). If the secret is not
          # set this expands to an empty string, which the scraper treats as
          # disabled, so the workflow needs no secret to run.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # tests/push.test.mjs uses node:sqlite, which Node 20 does not ship.
          # Keep this in step with the version the Tests workflow uses.
          node-version: '22'

      - name: Install ingestion dependencies
        run: npm ci --ignore-scripts

      - name: Ingest official office decisions
        run: node tools/scrape-embassies.mjs

      - name: Verify embassy checksums
        run: node tools/verify-embassy-checksums.mjs

      - name: Verify Ankara OCR decisions
        run: node tools/verify-ankara.mjs

      - name: Rebuild derived pages
        # The pages under status.html, reports/, monthly-report/ and the
        # freshness line are generated from data/. Rebuild them in the same
        # commit so a data push can never leave them stale.
        run: npm run rebuild:pages

      - name: Verify the full site build
        run: npm run build

      - name: Run the full Node suite against the rebuilt data
        # The page-level tests compare generated HTML with data/. The root pages
        # are only the last committed snapshot, so after a scrape they are one
        # data refresh behind; the build output is what this run produced.
        env:
          SITE_HTML_BASE: .pages-dist
        run: node --test tests/*.test.mjs

      - name: Commit updated data and derived pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "data: record $(date -u +%F) official decisions"
          # A failed push (e.g. a concurrent run committed first) is safe to
          # ignore: the embassy file is cumulative, so the next run re-derives
          # any missing rows by IRL dedupe and reconciles automatically.
          git push || echo "push failed - next scheduled run reconciles"
