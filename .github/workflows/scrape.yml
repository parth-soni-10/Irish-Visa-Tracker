name: Scrape Visa Decisions

on:
  workflow_dispatch: {}   # manual "Run workflow" button — still available for on-demand runs
  schedule:
    - cron: '30 2 * * 1-5'  # Mon–Fri 08:00 IST
    - cron: '0 3 * * 1-5'   # Mon–Fri 08:30 IST
    - cron: '30 3 * * 1-5'  # Mon–Fri 09:00 IST
    - cron: '0 4 * * 1-5'   # Mon–Fri 09:30 IST
    - cron: '30 4 * * 1-5'  # Mon–Fri 10:00 IST
    - cron: '0 5 * * 1-5'   # Mon–Fri 10:30 IST
    - cron: '30 5 * * 1-5'  # Mon–Fri 11:00 IST
    - cron: '0 6 * * 1-5'   # Mon–Fri 11:30 IST
    - cron: '30 6 * * 1-5'  # Mon–Fri 12:00 IST — final weekday run
    - cron: '30 2 * * 6,0'  # Sat–Sun 08:00 IST — weekend placeholder (run 1)
    - cron: '30 6 * * 6,0'  # Sat–Sun 12:00 IST — weekend placeholder (run 2)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit data/*.json back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/visa_decisions.json
          [ -f data/visa_meta.json ] && git add data/visa_meta.json
          git diff --staged --quiet || git commit -m "visa: record $(date -u +%F) decisions"
          # A failed push (e.g. a concurrent run committed first) is safe to
          # ignore: the embassy file is cumulative, so the next run re-derives
          # any missing rows by IRL dedupe and reconciles automatically.
          git push || echo "push failed — next scheduled run reconciles"
