name: Deliver Scheduled Exports

# Runs after the report data settles, with three layers of redundancy: the
# 07:15 UTC slot, a 12:15 UTC retry in case that slot is dropped, and a run
# after every completed scrape. The endpoint selects only rows whose next_run_at
# is due, so extra triggers are no-ops.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 7 * * *'  # daily 07:15 UTC, after the 07:00 UTC due time
    - cron: '15 12 * * *'  # same-day retry if the 07:15 slot is dropped
  workflow_run:
    workflows: ["Scrape Visa Decisions"]
    types: [completed]

permissions:
  contents: read

# Two triggers must not process the same due export twice.
concurrency:
  group: scheduled-exports
  cancel-in-progress: false

jobs:
  deliver:
    name: Send due private exports
    runs-on: ubuntu-latest
    steps:
      - name: Trigger export delivery
        env:
          CRON_SECRET: ${{ secrets.SCRAPER_CRON_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || 'https://irishvisaupdatetracker.pages.dev' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::SCRAPER_CRON_SECRET is not configured; scheduled exports cannot run."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 15 --max-time 120 \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$APP_BASE_URL/api/exports/run")
          echo "$response"
          # HTTP 200 can still carry failed deliveries; make those red.
          printf '%s' "$response" | jq -e '.ok == true' > /dev/null || {
            echo "::error::Scheduled export delivery reported failures"
            exit 1
          }
