name: Cron Failure Alerts

# Scheduled workflow failures notify only the user who last changed the cron
# schedule by default. This companion workflow sends the failure to the
# repository's ALERT_WEBHOOK_URL and deliberately fails if that secret is
# absent, so the failure is still visible in the Actions tab.
on:
  workflow_run:
    workflows:
      - Scrape Visa Decisions
      - Decision Alerts
      - Send Monthly Digest
      - Deliver Scheduled Exports
      - ML Model Retraining
      - Sync Community Timelines
      - Track Stamp 1G Processing Date
      - Track Employment Permit Dates
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cron-failure-alert-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  notify:
    name: Notify on failed scheduled run
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Send failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node tools/alert-run-failure.mjs
