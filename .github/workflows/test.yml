name: Tests

on:
  push:
    # The scraper rebuilds the derived pages and runs the full Node suite in
    # the same job. Skip a push that only carries data and the pages generated
    # from it; anything else runs every check.
    # (paths-ignore skips only when every changed file matches.)
    paths-ignore:
      - 'data/**'
      - 'status.html'
      - 'reports/**'
      - 'monthly-report/**'
      - 'decisions/**'
      - '*-visa-decisions.html'
      - 'irish-visa-decisions-today.html'
      - 'daily-summaries.html'
      - 'data-study.html'
      - 'press.html'
      - 'all-pages.html'
      - 'sitemap.xml'
      - 'sitemap-*.xml'
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run scraper + tracker tests
        run: python -m pytest test_scraper.py test_track_1g.py test_permits.py test_timelines.py -q

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Node dependencies
        # The test files import the Worker modules, which import runtime
        # packages (web-push, cheerio, xlsx). Without this step the suite died
        # on ERR_MODULE_NOT_FOUND rather than on a real assertion.
        run: npm ci --ignore-scripts

      - name: Build static assets
        # Some suites compare the pages the build produces (injected freshness
        # lines, generated snippets) rather than the checked-in snapshot. A
        # data-only commit updates the source data without rewriting every
        # derived page, so testing the built tree is the same rule the scrape
        # workflow uses.
        run: npm run build

      - name: Run the full Node test suite
        # The hand-picked list missed the CSP-hash and font-loading suites,
        # so a production styling regression shipped unnoticed. The full
        # suite takes about ten seconds.
        env:
          SITE_HTML_BASE: .pages-dist
        run: node --test tests/*.test.mjs

      - name: Audit served HTML for inline assets
        # The deployed CSP has no unsafe-inline for scripts or <style> elements;
        # every executable byte must come from /scripts or /styles. This also
        # rejects non-UTF-8 source files with a file:line:column diagnostic.
        run: python tools/check_html_scripts.py

      - name: Verify shared header and footer are generated
        # One partial owns the chrome; a page that drifts is stale markup.
        run: node tools/site-chrome.mjs --check

      - name: Syntax-check served CSS
        run: node tools/check-css.mjs

      - name: Syntax-check served JavaScript
        run: node tools/check-js-syntax.mjs

      - name: Check for dead named exports
        run: node tools/check-dead-code.mjs

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static assets
        # The audited pages inline their styles at build time, so audit the
        # tree production serves rather than the stale checked-in snapshot.
        run: npm run build

      - name: Run axe accessibility gate
        run: |
          npx wrangler pages dev .pages-dist --port 8794 > /tmp/wrangler-a11y.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8794/ > /dev/null; then
              AUDIT_BASE_URL=http://127.0.0.1:8794 node accessibility-audit.js
              exit $?
            fi
            sleep 2
          done
          cat /tmp/wrangler-a11y.log
          exit 1

  qa-sweep:
    # The full-route pass covers every sitemap URL at both target widths. It is
    # separate from the focused accessibility job because a route-level layout
    # or link regression should fail with its own named check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static assets
        # Sweep the tree production serves, including the generated sitemaps,
        # rather than the checked-in source snapshot.
        run: npm run build

      - name: Run full-route QA sweep
        run: |
          npx wrangler pages dev .pages-dist --port 8796 > /tmp/wrangler-qa.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8796/ > /dev/null; then
              node tools/qa-sweep.mjs --base http://127.0.0.1:8796
              exit $?
            fi
            sleep 2
          done
          cat /tmp/wrangler-qa.log
          exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E
        run: npx playwright test --project=chromium --timeout=120000 --workers=1

  webkit:
    # WebKit on an Ubuntu runner spends minutes in apt installing system
    # libraries (and hung there once). macOS ships them, so the browser is the
    # only download.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebKit
        run: npx playwright install webkit

      - name: Run WebKit chrome tests
        # details markers and scrollbars differ between engines; the chrome
        # behaviour is the part worth checking on a second engine.
        run: npx playwright test chrome-tests.js --project="Mobile Safari" --timeout=120000 --workers=1

  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static assets
        # /data/search_fallback.json is generated by the build, so the link
        # checker must run against the built tree rather than the source tree.
        run: npm run build

      - name: Check internal links and header layout
        # Link targets and the header-height invariant need the site served by
        # the same static layer production uses.
        run: |
          npx wrangler pages dev .pages-dist --port 8795 > /tmp/wrangler-chrome.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8795/ > /dev/null; then
              node tools/check-links.mjs --base http://127.0.0.1:8795 &&
              node tools/check-chrome-layout.mjs --base http://127.0.0.1:8795
              exit $?
            fi
            sleep 2
          done
          cat /tmp/wrangler-chrome.log
          exit 1
