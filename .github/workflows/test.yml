name: Tests

on:
  push:
    # The scraper commits data/*.json every ~30 min; pushes that touch ONLY
    # those generated files can't break the code, so don't burn a runner on them.
    # (paths-ignore skips only when every changed file matches.)
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run scraper + tracker tests
        run: python -m pytest test_scraper.py test_track_1g.py test_permits.py test_timelines.py -q

      - name: Syntax-check index.html inline scripts
        # The dashboard is one 4000-line single file; a stray brace or quote in
        # any inline block would only surface on the deployed site otherwise.
        run: python tools/check_html_scripts.py

      - name: Keep the CSP in step with index.html
        # _headers pins the two inline scripts by hash. Edit one without
        # re-hashing and the browser refuses to run it — the page still renders,
        # so the only place that shows up is production, and only as behaviour
        # that quietly stopped happening.
        run: python tools/check_csp_hashes.py
