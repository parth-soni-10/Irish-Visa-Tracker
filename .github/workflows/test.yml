name: Tests

on:
  push:
    # The scraper commits data/*.json every ~30 min; pushes that touch ONLY
    # those generated files can't break the code, so don't burn a runner on them.
    # (paths-ignore skips only when every changed file matches.)
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run scraper + tracker tests
        run: python -m pytest test_scraper.py test_track_1g.py test_permits.py test_timelines.py -q

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Node dependencies
        # The test files import the Worker modules, which import runtime
        # packages (web-push, cheerio, xlsx). Without this step the suite died
        # on ERR_MODULE_NOT_FOUND rather than on a real assertion.
        run: npm ci --ignore-scripts

      - name: Run agent-surface and product tests
        # Content negotiation, Markdown documents, the 404 contract, metadata,
        # analytics/fees/exports, auth tokens and notifications.
        run: node --test tests/agent-docs.test.mjs tests/portal.test.mjs tests/export-tokens.test.mjs tests/email-tokens.test.mjs tests/notifications.test.mjs tests/predict.test.mjs tests/reports.test.mjs tests/push.test.mjs tests/email-webhook.test.mjs tests/embassy-pdf-ingestion.test.mjs tests/community-submissions.test.mjs tests/alerts-run.test.mjs tests/telegram.test.mjs tests/digest-schedule.test.mjs

      - name: Run admin, durable rate-limit and conversion tests
        # The admin metrics/token surface and the D1-backed limiter had no
        # direct coverage before these suites.
        run: node --test tests/admin-api.test.mjs tests/rate-limit.test.mjs tests/events.test.mjs

      - name: Run health and monitoring tests
        run: node --test tests/health.test.mjs tests/monitoring.test.mjs

      - name: Run Ankara ingestion and PDF history tests
        run: node --test tests/ankara-ocr.test.mjs tests/ankara-checksum.test.mjs tests/decision-history.test.mjs tests/scrape-ocr-guard.test.mjs

      - name: Run weekly PDF backfill fixture tests
        run: node --test tests/backfill-weekly-history.test.mjs

      - name: Run email delivery tests
        run: node --test tests/email-send.test.mjs

      - name: Run embassy checksum tests
        run: node --test tests/embassy-checksums.test.mjs

      - name: Audit served HTML for inline assets
        # The deployed CSP has no unsafe-inline for scripts or <style> elements;
        # every executable byte must come from /scripts or /styles.
        run: python tools/check_html_scripts.py

      - name: Syntax-check served JavaScript
        run: node tools/check-js-syntax.mjs

      - name: Check for dead named exports
        run: node tools/check-dead-code.mjs

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe accessibility gate
        run: |
          npx wrangler pages dev . --port 8794 > /tmp/wrangler-a11y.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8794/ > /dev/null; then
              AUDIT_BASE_URL=http://127.0.0.1:8794 node accessibility-audit.js
              exit $?
            fi
            sleep 2
          done
          cat /tmp/wrangler-a11y.log
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E
        run: npx playwright test --project=chromium --timeout=120000 --workers=1
