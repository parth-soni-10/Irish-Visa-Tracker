<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found | Irish Visa Decision Tracker</title>
<meta name="robots" content="noindex" />
<!--
  Why this file exists rather than being left to the platform: with no 404.html in
  the upload, Pages answers `200` with index.html for every unmatched path, so a
  path that serves nothing looks like a page that does. Until this file, an
  unknown path got Cloudflare's generic 509-byte error instead of the site's own.

  No inline style and no script: the CSP in _headers is `script-src 'self'` with
  hashes, and the sheet below is same-origin, so this page needs no allowance.
-->
<link rel="stylesheet" href="/404.css" />
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Nothing at this address</h1>
  <p>That address is not part of the tracker. <a href="/">Back to the decision tracker</a>.</p>
</main>
</body>
</html>
