# Local development config — for `wrangler dev` only, never for a deploy.
#
#     npx wrangler dev --config wrangler.dev.toml
#
# Why this is a second file: wrangler.toml is the Pages build's bundle input, and
# a bundle input carries only what bundling reads. The assets directory, the
# every-request-goes-to-the-script rule and the D1 binding below are what a
# running process needs, not what esbuild needs — and leaving them in
# wrangler.toml is how a `wrangler deploy` run from this directory silently
# publishes a second copy of this site to a workers.dev hostname.
#
# Kept in step with pages/wrangler.toml by hand: the database id is the one the
# deployed site writes submissions to, so `sync_timelines.py` against
# http://localhost:8787 reads real rows. To test what the deploy serves, run the
# build command's two steps and then `npx wrangler pages dev .pages-dist`.

name = "irish-visa-tracker"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "irish-visa-tracker-submissions"
database_id = "d7dc618b-1d18-463c-80d0-c9f4d0b9e6ab"
