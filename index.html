<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irish Visa Decision Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <base target="_blank">
</head>
<body>
    <div id="visa-dash"></div>
    <style>
        /* ============================================================
           VISA DECISION TRACKER — "Sunrise" redesign
           Design DNA:
           · Manus     — warm cream canvas, coral-orange brand accent,
                         halo/orb glows, gradient depth on heroes
           · Watermelon– soft coral/sage semantic palette (approved green,
                         rejected coral) on cream
           · Motion    – elevated white cards, pill segmented tabs,
                         springy micro-interactions, soft warm shadows
           · Haikei    – organic blob + aurora/mesh backgrounds, noise grain
           All class names, IDs and data-attributes used by the app's JS
           are preserved exactly — this is a pure visual-layer swap.
           ============================================================ */

        body { margin: 0; background: #f6f3ee; }
        body:has(#visa-dash[data-theme="dark"]) { background: #131110; }

        #visa-dash * { box-sizing: border-box; }
        #visa-dash {
            --canvas: #f6f3ee;
            --ink: #211d19;
            --ink-soft: #6b6153;
            --ink-muted: #a69d8c;
            --surface: #ffffff;
            --surface-raised: #fbf9f3;
            --surface-hover: #f2ede2;
            --border: #e8e1d2;
            --brand: #ff4d2e;
            --brand-2: #ff8a3d;
            --green: #0fa36b;
            --green-light: #3ad99a;
            --green-soft: #e3f4eb;
            --green-text: #0b7a50;
            --amber: #e8a50c;
            --amber-soft: #fbf0d7;
            --amber-text: #a16207;
            --red: #e8503a;
            --red-soft: #fce8e3;
            --red-text: #c0392b;
            --violet: #7c5cf0;
            --rose: #f43f5e;
            --shadow-sm: 0 1px 2px rgba(33, 29, 25, .05);
            --shadow-md: 0 10px 30px -12px rgba(33, 29, 25, .16);
            --shadow-lg: 0 24px 60px -20px rgba(33, 29, 25, .26);
            --ring: rgba(255, 77, 46, .14);
            font-family: "Inter", -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 24px 72px;
            position: relative;
            /* Creates a stacking context so the fixed ::before/::after
               aurora + grain layers (z-index:-1) paint ABOVE this element's
               own background but below its content. Without it, the opaque
               canvas background would cover them and the page looks flat. */
            isolation: isolate;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- page aurora + grain (fixed, behind content) ---- */
        #visa-dash::before,
        #visa-dash::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        #visa-dash::before {
            background:
                radial-gradient(46% 40% at 84% 6%, rgba(255, 77, 46, .09), transparent 62%),
                radial-gradient(42% 44% at 6% 90%, rgba(15, 163, 107, .09), transparent 62%),
                radial-gradient(50% 44% at 50% 60%, rgba(124, 92, 240, .05), transparent 64%),
                var(--canvas);
        }
        #visa-dash::after {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.03'/></svg>");
            background-size: 140px 140px;
        }
        #visa-dash[data-theme="dark"]::before {
            background:
                radial-gradient(46% 40% at 84% 6%, rgba(255, 106, 77, .10), transparent 62%),
                radial-gradient(42% 44% at 6% 90%, rgba(58, 217, 154, .08), transparent 62%),
                radial-gradient(50% 44% at 50% 60%, rgba(124, 92, 240, .07), transparent 64%),
                var(--canvas);
        }

        #visa-dash .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; }

        /* ---- header ---- */
        #visa-dash .eyebrow {
            font-size: 11px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--brand);
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #visa-dash .eyebrow::before {
            content: '';
            width: 18px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--brand), var(--brand-2));
        }
        #visa-dash h1 {
            font-family: "Sora", "Inter", system-ui, sans-serif;
            font-size: 30px;
            margin: 0 0 2px;
            font-weight: 800;
            letter-spacing: -.03em;
            color: var(--ink);
            background: linear-gradient(100deg, var(--brand) 10%, #f59e0b 55%, var(--brand-2) 92%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        /* Gradient text is clipped only where background-clip:text is
           supported; elsewhere the H1 keeps a readable solid ink color. */
        @supports (-webkit-background-clip: text) or (background-clip: text) {
            #visa-dash h1 {
                background: linear-gradient(100deg, var(--brand) 10%, #f59e0b 55%, var(--brand-2) 92%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            #visa-dash[data-theme="dark"] h1 {
                background: linear-gradient(100deg, #ff9e66, #f2c14e, #ff6a4d);
                -webkit-background-clip: text;
                background-clip: text;
            }
        }
        #visa-dash .sub {
            color: var(--ink-muted);
            font-size: 13px;
            margin-bottom: 22px;
        }

        /* ---- title row + badges ---- */
        #visa-dash .titlerow {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        #visa-dash .titlerow h1 { margin: 0 0 2px; }
        #visa-dash .stutter-badge {
            background: var(--amber-soft);
            color: var(--amber-text);
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            margin-top: 3px;
            border: 1px solid rgba(232, 165, 12, .3);
        }
        #visa-dash .stutter-badge i { font-style: normal; font-size: 12px; }

        #visa-dash .theme-toggle {
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: var(--ink-soft);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        #visa-dash .theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--ink);
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--shadow-md);
        }
        #visa-dash .theme-toggle:active { transform: scale(.92); }

        /* ---- loading bar ---- */
        #visa-dash .topbar {
            height: 4px;
            background: var(--border);
            border-radius: 100px;
            overflow: hidden;
            margin-bottom: 22px;
            position: relative;
        }
        #visa-dash .topbar-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 35%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--brand), var(--brand-2), var(--green-light));
            animation: visa-indeterminate 1.1s ease-in-out infinite;
        }
        @keyframes visa-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(340%); }
        }

        /* ---- nav pills (motion-primitives segmented control) ---- */
        #visa-dash .navpills {
            display: inline-flex;
            gap: 4px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            background: color-mix(in srgb, var(--surface) 55%, transparent);
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 100px;
            box-shadow: var(--shadow-sm);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        #visa-dash .navpill {
            padding: 9px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            border: none;
            color: var(--ink-soft);
            background: transparent;
            transition: all .28s cubic-bezier(.34, 1.56, .64, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: -.01em;
        }
        #visa-dash .navpill::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            opacity: 0;
        }
        #visa-dash .navpill.rippling::after {
            animation: nav-ripple .5s ease-out;
        }
        @keyframes nav-ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: .45; }
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; }
        }
        #visa-dash .navpill:hover { background: var(--surface-hover); color: var(--ink); }
        #visa-dash .navpill.active {
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(33, 29, 25, .35);
            text-shadow: 0 1px 2px rgba(0, 0, 0, .15);
        }
        #visa-dash .navpill[data-tab="home"].active    { background: linear-gradient(135deg, #0fa36b, #3ad99a); }
        #visa-dash .navpill[data-tab="daily"].active   { background: linear-gradient(135deg, #7c5cf0, #a78bfa); }
        #visa-dash .navpill[data-tab="past"].active    { background: linear-gradient(135deg, #e8a50c, #fbbf24); }
        #visa-dash .navpill[data-tab="suggest"].active { background: linear-gradient(135deg, #f43f5e, #fb7185); }
        #visa-dash .navpill.active:hover { filter: brightness(1.05); }

        /* ---- stat cards ---- */
        #visa-dash .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        #visa-dash .card {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 18px 16px;
            box-shadow: var(--shadow-sm);
            opacity: 0;
            transform: translateY(14px);
            animation: visa-card-in .5s cubic-bezier(.22, 1, .36, 1) forwards;
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1),
                        box-shadow .25s ease,
                        border-color .25s ease;
        }
        #visa-dash .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--brand), var(--brand-2), transparent);
            opacity: .5;
            transition: opacity .25s ease;
        }
        #visa-dash .card:nth-child(1) { animation-delay: 0.03s; }
        #visa-dash .card:nth-child(2) { animation-delay: 0.08s; }
        #visa-dash .card:nth-child(3) { animation-delay: 0.13s; }
        #visa-dash .card:nth-child(4) { animation-delay: 0.18s; }
        #visa-dash .card:nth-child(5) { animation-delay: 0.23s; }
        #visa-dash .card:nth-child(6) { animation-delay: 0.28s; }
        #visa-dash .card:nth-child(7) { animation-delay: 0.33s; }
        #visa-dash .card:nth-child(8) { animation-delay: 0.38s; }
        @keyframes visa-card-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #visa-dash .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: rgba(255, 77, 46, .25);
        }
        #visa-dash .card:hover::before { opacity: 1; }
        @media (prefers-reduced-motion: reduce) {
            #visa-dash .card { animation: none; opacity: 1; transform: none; }
        }

        #visa-dash .card .label {
            font-size: 10px;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        #visa-dash .card .value {
            font-size: 22px;
            font-weight: 700;
            font-family: "Sora", "Inter", system-ui, sans-serif;
            letter-spacing: -.02em;
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1);
        }
        #visa-dash .card:hover .value { transform: scale(1.03); }
        #visa-dash .card .value.green { color: var(--green); }
        #visa-dash .card .value.red { color: var(--red); }
        #visa-dash .card .value.amber { color: var(--amber); }

        /* ---- tables ---- */
        #visa-dash .table-wrap {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }
        #visa-dash table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
            min-width: 380px;
        }
        #visa-dash th {
            text-align: left;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--ink-muted);
            background: var(--surface-raised);
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-weight: 700;
        }
        #visa-dash td {
            padding: 12px 16px;
            font-size: 13.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            color: var(--ink-soft);
        }
        #visa-dash tbody tr {
            transition: background .15s ease;
            content-visibility: auto;
            contain-intrinsic-size: 0 56px;
        }
        /* Hover highlight sits on the first td (not the tr) so it works under
           table-layout:fixed where a tr::before pseudo would generate an
           anonymous table-cell and shift every real td column over by one. */
        #visa-dash tbody tr td:first-child { position: relative; }
        #visa-dash tbody tr td:first-child::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--green), var(--green-light));
            opacity: 0;
            border-radius: 0 3px 3px 0;
            transition: opacity .25s ease;
            pointer-events: none;
        }
        #visa-dash tbody tr:hover td:first-child::before { opacity: 1; }
        #visa-dash tbody tr:hover { background: var(--surface-hover); }

        /* Home + Past results tables: 3 columns. Fixed layout — browser sizes
           each column to fit its content (no header collisions across the
           row); the table takes full container width on wide screens.
           min-width keeps narrow viewports scrollable rather than squishing. */
        #visa-dash .results-table { table-layout: fixed; width: 100%; min-width: 360px; }
        #visa-dash .results-table th, #visa-dash .results-table td { white-space: normal; overflow-wrap: break-word; }
        #visa-dash .results-table th:nth-child(1), #visa-dash .results-table td:nth-child(1) { min-width: 12ch; }
        #visa-dash .results-table th:nth-child(2), #visa-dash .results-table td:nth-child(2) { min-width: 16ch; }
        /* Daily summary table: 5 columns. Same fixed auto-width layout. */
        #visa-dash .daily-table { table-layout: fixed; width: 100%; min-width: 480px; }
        #visa-dash .daily-table th, #visa-dash .daily-table td { white-space: normal; overflow-wrap: break-word; }
        #visa-dash .daily-table th:nth-child(1), #visa-dash .daily-table td:nth-child(1),
        #visa-dash .daily-table th:nth-child(2), #visa-dash .daily-table td:nth-child(2),
        #visa-dash .daily-table th:nth-child(3), #visa-dash .daily-table td:nth-child(3),
        #visa-dash .daily-table th:nth-child(4), #visa-dash .daily-table td:nth-child(4),
        #visa-dash .daily-table th:nth-child(5), #visa-dash .daily-table td:nth-child(5) { min-width: 10ch; }
        /* Sentinel row appended by IntersectionObserver infinite scroll. */
        #visa-dash .row-sentinel { contain-intrinsic-size: 0 18px; }
        #visa-dash .row-sentinel td { height: 18px; border-bottom: none; }
        @media (prefers-reduced-motion: reduce) {
            #visa-dash tbody tr { content-visibility: visible; }
        }
        #visa-dash tr:last-child td { border-bottom: none; }

        /* ---- decision pills ---- */
        #visa-dash .pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            letter-spacing: .01em;
        }
        #visa-dash .pill::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .4), transparent);
            transform: skewX(-20deg);
            transition: left .5s ease;
            pointer-events: none;
        }
        #visa-dash .pill:hover::after { left: 120%; }
        #visa-dash .pill.green { background: var(--green-soft); color: var(--green-text); border-color: rgba(15, 163, 107, .22); }
        #visa-dash .pill.red { background: var(--red-soft); color: var(--red-text); border-color: rgba(232, 80, 58, .22); }
        #visa-dash .pill.amber { background: var(--amber-soft); color: var(--amber-text); border-color: rgba(232, 165, 12, .25); }

        /* ---- inputs ---- */
        #visa-dash .searchbar {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0 18px;
            height: 46px;
            background: var(--surface);
            margin-bottom: 16px;
            max-width: 440px;
            transition: all .2s ease;
            box-shadow: var(--shadow-sm);
        }
        #visa-dash .searchbar:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px var(--ring);
        }
        #visa-dash .searchbar svg { flex-shrink: 0; opacity: .45; }
        #visa-dash .searchbar input[type=text] {
            border: none;
            outline: none;
            font-size: 14px;
            flex: 1;
            background: transparent;
            color: var(--ink);
            width: auto;
            max-width: none;
            padding: 0;
            margin: 0;
            border-radius: 0;
        }
        #visa-dash .searchbar input[type=text]:focus { outline: none; box-shadow: none; }
        #visa-dash input[type=text] {
            width: 100%;
            max-width: 320px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 14px;
            background: var(--surface);
            color: var(--ink);
            transition: all .2s ease;
        }
        #visa-dash input[type=text]:focus,
        #visa-dash textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 4px var(--ring);
        }
        #visa-dash textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            min-height: 100px;
            margin-bottom: 12px;
            background: var(--surface);
            resize: vertical;
            transition: all .2s ease;
        }

        /* ---- button ---- */
        #visa-dash .btn {
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
            box-shadow: 0 8px 20px -8px rgba(255, 77, 46, .55);
        }
        #visa-dash .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -10px rgba(255, 77, 46, .6);
            filter: brightness(1.04);
        }
        #visa-dash .btn:active { transform: scale(.96); }
        #visa-dash .btn:disabled {
            opacity: .5;
            cursor: default;
            transform: none;
            box-shadow: none;
            filter: none;
        }

        /* ---- notes / empty / warnings ---- */
        #visa-dash .note { font-size: 13px; color: var(--ink-muted); margin-top: 10px; line-height: 1.6; }
        #visa-dash .empty {
            padding: 56px 20px;
            text-align: center;
            color: var(--ink-muted);
            font-size: 14px;
        }
        #visa-dash .config-warn {
            background: var(--amber-soft);
            color: var(--amber-text);
            border: 1px solid rgba(232, 165, 12, .35);
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 13px;
            margin-bottom: 22px;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
        }
        #visa-dash .config-warn code {
            background: rgba(0, 0, 0, .05);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 12px;
        }
        #visa-dash .datefilter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0 16px;
            height: 44px;
            background: var(--surface);
            transition: all .2s ease;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        #visa-dash .datefilter:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px var(--ring);
        }
        #visa-dash .datefilter input[type=date] {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            color: var(--ink);
            font-family: inherit;
        }
        #visa-dash .datefilter .clear-btn {
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            color: var(--ink-muted);
            transition: color .15s;
            visibility: hidden;
        }
        #visa-dash .datefilter.has-filter .clear-btn { visibility: visible; }

            // string concat (no per-cell escape work).  Also escapes every
            // value and header (the prior full-render path didn't, which
            // was an XSS vector if the Google Sheet ever had hostile data).
            function preloadSuggestionRow(s) {
                if (s._html) return s;
                var keys = Object.keys(s);
                s._html = '<tr>' + keys.map(function(h) {
                    return '<td>' + escapeHtml(s[h]) + '</td>';
                }).join('') + '</tr>';
                return s;
            }

            function escapeHtml(value) {
                return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[ch]));
            }

            function fmtPct(n) { return isFinite(n) ? (n * 100).toFixed(1) + '%' : '\u2014'; }

            function daysAgo(dateStr) { return Math.floor((Date.now() - new Date(dateStr + 'T00:00:00')) / 86400000); }

            function weekdayLong(dateStr) {
                const d = new Date(dateStr + 'T00:00:00');
                return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            }

            function groupByDate(rows) {
                const m = new Map();
                rows.forEach(r => { if (!m.has(r.date)) m.set(r.date, []);
                    m.get(r.date).push(r); });
                return [...m.entries()].sort((a, b) => b[0].localeCompare(a[0]));
            }

            function avgDailyApps(byDate) {
                var filtered = byDate.filter(function(e) { return e[0] !== EXCLUDE_FROM_AVERAGES; });
                if (!filtered.length) return 0;
                var sum = 0;
                for (var i = 0; i < filtered.length; i++) sum += filtered[i][1].length;
                return sum / filtered.length;
            }

            async function loadData(options) {
                const force = options && options.force;
                // Return cached data only if it's still fresh AND we're not forcing a refresh.
                if (!force && cache !== null && cacheFetchedAt && (Date.now() - cacheFetchedAt < CACHE_FRESH_MS)) return cache;
                if (dataPromise) return dataPromise;
                if (!WEB_APP_URL) {
                    if (cache === null) cache = [];
                    cacheFetchedAt = Date.now();
                    return cache;
                }
                dataPromise = (async () => {
                    try {
                        const res = await fetch(WEB_APP_URL + '?action=raw');
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const raw = await res.json();
                        // Pre-compute classify + row HTML once per row, then sort by
                        // date desc so render paths are pure filter + string concat.
                        cache = raw.map(r => preloadRow(Array.isArray(r) ? { date: r[0], irl: r[1], decision: r[2] } : r));
                        cache.sort((a, b) => b.date.localeCompare(a.date));
                        cacheFetchedAt = Date.now();
                    } catch (e) {
                        console.warn('loadData failed:', e);
                        if (cache === null) cache = [];
                    } finally {
                        dataPromise = null;
                    }
                    return cache;
                })();
                return dataPromise;
            }


            async function loadSuggestions() {
                if (suggestionsCache) return suggestionsCache;
                if (!WEB_APP_URL) { suggestionsCache = []; return suggestionsCache; }
                try {
                    const res = await fetch(WEB_APP_URL + '?action=suggestions');
                    const raw = await res.json();
                    if (Array.isArray(raw) && raw.length > 0) {
                        if (Array.isArray(raw[0])) {
                            const headers = raw[0];
                            suggestionsCache = raw.slice(1).map(row => {
                                const obj = {};
                                headers.forEach((h, i) => { obj[h] = row[i] !== undefined ? row[i] : ''; });
                                return preloadSuggestionRow(obj);
                            });
                        } else {
                            suggestionsCache = raw.map(preloadSuggestionRow);
                        }
                    } else {
                        suggestionsCache = [];
                    }
                    return suggestionsCache;
                } catch (e) {
                    suggestionsCache = [];
                    return suggestionsCache;
                }
            }

            function renderConfigWarning() {
                return WEB_APP_URL ? '' :
                    '<div class="config-warn">No data source configured yet. Deploy <code>Code.gs</code> as a Web App and paste its <code>/exec</code> URL into <code>WEB_APP_URL</code> at the top of this file\'s script.</div>';
            }

            function searchIcon() {
                return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
            }

            function readmeSection() {
                return '<div class="readme"><div class="readme-title">How this tracker works</div>' +
                    '<p>Every day, an automated job checks the Irish embassy\'s New Delhi visa decisions page for the latest published spreadsheet and pulls any application numbers that haven\'t been recorded yet.</p>' +
                    '<ul>' +
                    '<li><strong>Home</strong> \u2014 today\'s snapshot, headline stats, and every result from the most recent file.</li>' +
                    '<li><strong>Daily summary</strong> \u2014 one row per day: volume, day-on-day change, acceptance and rejection rates.</li>' +
                    '<li><strong>Past results</strong> \u2014 full history, searchable by application number.</li>' +
                    '<li><strong>Suggestions</strong> \u2014 leave feedback. I check the suggestions and get back with a reply asap.</li>' +
                    '</ul>' +
                    '<p style="margin-top:12px;"><strong>After approval:</strong> Once your visa is approved, it is dispatched through <strong>BlueDart</strong> (in most cases) and follows standard courier delivery timelines from Delhi to your address.</p>' +
                    '</div>';
            }

            // ===== hero builder (Mockup C) — per-tab hero with real data =====
            function buildHeroHTML(tabId, rows) {
                const byDate = groupByDate(rows);
                const total = rows.length;
                const accepted = rows.filter(r => classify(r.decision) === 'accepted').length;
                const rejected = rows.filter(r => classify(r.decision) === 'rejected').length;
                const accPct = total ? accepted / total : 0;
                const rejPct = total ? rejected / total : 0;
                const avg = avgDailyApps(byDate);
                const latest = byDate.length ? byDate[0] : null;
                const latestCount = latest ? latest[1].length : 0;
                const prev = byDate.length > 1 ? byDate[1] : null;
                const dayDiff = prev ? latestCount - prev[1].length : 0;

                const states = {
                    home: {
                        eyebrow: "TODAY'S SNAPSHOT",
                        title: latestCount + ' new outcomes<br/>today.',
                        sub: (dayDiff >= 0 ? '+' : '') + dayDiff + ' vs. yesterday · ' + fmtPct(accPct) + ' accepted.',
                        visual: '<div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring-core">' + latestCount + '</div>'
                    },
                    daily: {
                        eyebrow: 'THIS WEEK',
                        title: byDate.length + ' days<br/>on record.',
                        sub: (function() {
                            // Mirror the Past hero: sub-text shows the actual
                            // date range so the user sees both totals AND the
                            // dates covered. Week boundary Sun -> Sat.
                            var _t = new Date();
                            var _ws = new Date(_t.getFullYear(), _t.getMonth(), _t.getDate() - _t.getDay());
                            var _we = new Date(_ws); _we.setDate(_ws.getDate() + 6);
                            var _mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                            return 'Avg ' + avg.toFixed(1) + ' applications/day · ' + fmtPct(accPct) + ' accepted · week of ' +
                                   _mn[_ws.getMonth()] + ' ' + _ws.getDate() + '\u2013' + _mn[_we.getMonth()] + ' ' + _we.getDate() + '.';
                        })(),
                        visual: (function() {
                            // Current calendar week (Sun -> Sat) containing
                            // today, matching the Past hero's window. weekStart
                            // is the most-recent Sunday on or before today; we
                            // look each of 7 days up in a byDate Map. Missing
                            // days render as zero-height bars.
                            var today = new Date();
                            var weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
                            var byDateMap = new Map(byDate);
                            var weekDays = [];
                            for (var wi = 0; wi < 7; wi++) {
                                var d = new Date(weekStart);
                                d.setDate(weekStart.getDate() + wi);
                                var ds = d.getFullYear() + '-' +
                                         String(d.getMonth() + 1).padStart(2, '0') + '-' +
                                         String(d.getDate()).padStart(2, '0');
                                weekDays.push([ds, byDateMap.get(ds) || []]);
                            }
                            var maxApps = Math.max.apply(null, weekDays.map(function(d) { return d[1].length; }).concat([1]));
                            return '<div class="wave">' + weekDays.map(function(d, i) {
                                var dayRows = d[1];
                                return '<div class="wave-bar" style="height:' + Math.max(8, (dayRows.length / maxApps) * 120) + 'px; animation-delay:' + (i * 0.07) + 's"></div>';
                            }).join('') + '</div>';
                        })()
                    },
                    past: {
                        eyebrow: 'THIS WEEK',
                        title: 'Accepted & rejected,<br/>side by side.',
                        sub: (function() {
                            // Sub-text mirrors the chart's week range so the user
                            // sees both the totals AND the exact dates covered.
                            // Week boundary is Sunday -> Saturday (matches the
                            // Sun-first days[] array elsewhere in this file).
                            var _t = new Date();
                            var _ws = new Date(_t.getFullYear(), _t.getMonth(), _t.getDate() - _t.getDay());
                            var _we = new Date(_ws); _we.setDate(_ws.getDate() + 6);
                            var _mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                            return fmtPct(accPct) + ' accepted · ' + fmtPct(rejPct) + ' rejected · ' + total.toLocaleString() + ' total · ' +
                                   'week of ' + _mn[_ws.getMonth()] + ' ' + _ws.getDate() + '\u2013' + _mn[_we.getMonth()] + ' ' + _we.getDate() + '.';
                        })(),
                        visual: (function() {
                            // Current calendar week (Sun -> Sat) containing today,
                            // not the rolling last 7 calendar days. weekStart is
                            // the most-recent Sunday on or before today; iterate
                            // 7 days forward and look each one up in a byDate
                            // Map. Missing days (no decisions yet, or future
                            // days in this week) render as empty bars.
                            var today = new Date();
                            var weekStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
                            var byDateMap = new Map(byDate);
                            var last7 = [];
                            for (var wi = 0; wi < 7; wi++) {
                                var d = new Date(weekStart);
                                d.setDate(weekStart.getDate() + wi);
                                var ds = d.getFullYear() + '-' +
                                         String(d.getMonth() + 1).padStart(2, '0') + '-' +
                                         String(d.getDate()).padStart(2, '0');
                                last7.push([ds, byDateMap.get(ds) || []]);
                            }
                            var maxVal = Math.max.apply(null, last7.map(function(d) {
                                var dr = d[1];
                                return dr.filter(function(r) { return classify(r.decision) === 'accepted'; }).length +
                                       dr.filter(function(r) { return classify(r.decision) === 'rejected'; }).length;
                            }).concat([1]));
                            var scale = Math.min(1, 104 / Math.max(maxVal, 1));
                            var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                            return '<div class="wf">' + last7.map(function(d, i) {
                                var dayRows = d[1];
                                var acc = dayRows.filter(function(r) { return classify(r.decision) === 'accepted'; }).length;
                                var rej = dayRows.filter(function(r) { return classify(r.decision) === 'rejected'; }).length;
                                var total = acc + rej;
                                var accPct = total ? Math.round(acc / total * 100) : 0;
                                var parts = d[0].split('-');
                                var dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                                var dateLabel = days[dateObj.getDay()] + ' ' + (dateObj.getDate() < 10 ? '0' + dateObj.getDate() : dateObj.getDate());
                                return '<div class="wf-col" style="--d:' + (i * 0.07).toFixed(2) + 's" title="' + d[0] + ' · ' + acc + ' accepted · ' + rej + ' rejected · ' + accPct + '%">' +
                                    '<div class="wf-date">' + escapeHtml(dateLabel) + '</div>' +
                                    '<div class="wf-bars">' +
                                        '<div class="wf-seg a" style="height:' + Math.max(3, acc * scale) + 'px"></div>' +
                                        '<div class="wf-seg r" style="height:' + Math.max(3, rej * scale) + 'px"></div>' +
                                    '</div>' +
                                '</div>';
                            }).join('') + '</div>';
                        })()
                    },
                    suggest: {
                        eyebrow: 'FROM USERS',
                        title: 'Real notes,<br/>real replies.',
                        sub: 'Leave a suggestion below. I read every one and reply asap.',
                        visual: (function() {
                            // The suggestion object's keys come straight from the
                            // backend header row, so they could be anything
                            // (e.g. SUGGESTION/PROBLEM, Suggestion, Message,
                            // Name, NAME). A regex-based key finder keeps the
                            // hero rendering correctly no matter how the sheet
                            // is titled.
                            var lastSugg = (suggestionsCache && suggestionsCache.length) ? suggestionsCache[suggestionsCache.length - 1] : null;
                            if (!lastSugg) {
                                return '<div class="paper"><div class="paper-title">Recent</div><div class="paper-text">No suggestions yet</div></div>';
                            }
                            var keys = Object.keys(lastSugg);
                            var textKey = keys.find(function(k) {
                                var lk = k.toLowerCase();
                                return /sugg|comment|message|feedback|body|note|problem/.test(lk) && !/^name|^user|^from|^by/.test(lk);
                            });
                            var nameKey = keys.find(function(k) { return /^(name|user|from|by)$/i.test(k); });
                            var text = textKey ? (lastSugg[textKey] || '') : '';
                            var name = nameKey ? (lastSugg[nameKey] || '') : '';
                            var display = text || 'No suggestions yet';
                            return '<div class="paper"><div class="paper-title">' + (name ? 'From: ' + escapeHtml(name) : 'Recent') + '</div><div class="paper-text">' + escapeHtml(display) + '</div></div>';
                        })()
                    }
                };
                return states[tabId] || states.home;
            }

            function morphHero() {
                var hero = document.getElementById('hero');
                if (!hero || window._heroHasRendered) return;
                window._heroHasRendered = true;
                var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReduced) {
                    hero.style.opacity = '1';
                    return;
                }
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        hero.style.opacity = '1';
                    });
                });
            }

            function animateHeroSwitch(tabId, rows) {
                var hero = document.getElementById('hero');
                if (!hero) return;
                if (hero._switchTimer) clearTimeout(hero._switchTimer);
                var state = buildHeroHTML(tabId, rows);
                hero.style.transition = 'opacity 0.18s ease';
                hero.style.opacity = '0.4';
                hero._switchTimer = setTimeout(function() {
                    hero._switchTimer = null;
                    hero.setAttribute('data-id', tabId);
                    hero.querySelector('.hero-eyebrow').textContent = state.eyebrow;
                    hero.querySelector('.hero-title').innerHTML = state.title;
                    hero.querySelector('.hero-sub').textContent = state.sub;
                    hero.querySelector('.visual').innerHTML = state.visual;
                    hero.style.opacity = '1';
                }, 180);
            }

            var _searchDebounce = null;

            function wireTabListeners() {
                var homeSearchEl = document.getElementById('home-search');
                if (homeSearchEl) {
                    homeSearchEl.addEventListener('input', function(e) {
                        homeSearchTerm = e.target.value;
                        // Debounce so rapid typing coalesces into a single repaint.
                        if (_searchDebounce) clearTimeout(_searchDebounce);
                        _searchDebounce = setTimeout(function() {
                            _searchDebounce = null;
                            if (activeTab === 'home') paintHomeRows();
                        }, 150);
                    });
                    if (activeTab === 'home') {
                        homeSearchEl.focus();
                        homeSearchEl.setSelectionRange(homeSearchEl.value.length, homeSearchEl.value.length);
                    }
                }
                var dateFilterEl = document.getElementById('past-date-filter');
                if (dateFilterEl) dateFilterEl.addEventListener('change', function(e) {
                    pastDateFilter = e.target.value;
                    // Toggle .has-filter on the datefilter wrapper so the X clear
                    // button appears/disappears WITHOUT re-rendering the whole
                    // past layout (the button is always in the DOM, just hidden).
                    if (dateFilterEl.parentElement) {
                        dateFilterEl.parentElement.classList.toggle('has-filter', !!pastDateFilter);
                    }
                    if (activeTab === 'past') paintPastRows();
                });
                var dateClearEl = document.getElementById('past-date-clear');
                if (dateClearEl) dateClearEl.addEventListener('click', function() {
                    pastDateFilter = '';
                    if (dateClearEl.parentElement) {
                        dateClearEl.parentElement.classList.remove('has-filter');
                    }
                    if (activeTab === 'past') paintPastRows();
                });
                var suggBtn = document.getElementById('sugg-submit');
                if (suggBtn) suggBtn.addEventListener('click', submitSuggestion);
                var scrollBtn = document.getElementById('scroll-top-btn');
                if (scrollBtn) {
                    var onScroll = function() {
                        if (window.scrollY > 300) scrollBtn.classList.add('visible');
                        else scrollBtn.classList.remove('visible');
                    };
                    if (window._scrollTopHandler) window.removeEventListener('scroll', window._scrollTopHandler);
                    window._scrollTopHandler = onScroll;
                    window.addEventListener('scroll', onScroll, { passive: true });
                    onScroll();
                    scrollBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
                }
            }

            async function switchTab(tabId) {
                if (!document.getElementById('hero')) return;
                activeTab = tabId;
                var pills = document.querySelectorAll('#visa-dash .navpill');
                for (var i = 0; i < pills.length; i++) {
                    pills[i].classList.toggle('active', pills[i].getAttribute('data-tab') === tabId);
                }
                // Use cached data to avoid stutter
                var rows = cache && cache.length ? cache : await loadData();
                // Load suggestions BEFORE hero so the typewriter card shows real data
                if (tabId === 'suggest') await loadSuggestions();
                animateHeroSwitch(tabId, rows);
                var tabBody = document.getElementById('tab-body');
                if (!tabBody) return;
                if (tabId === 'home') tabBody.innerHTML = renderHomeLayout(rows);
                else if (tabId === 'daily') tabBody.innerHTML = renderDailySummary(rows);
                else if (tabId === 'past') tabBody.innerHTML = renderPastLayout(rows);
                else { tabBody.innerHTML = renderSuggestLayout(); paintSuggestRows(suggestionsCache); }
                wireTabListeners();
                // Paint deferred row content after the layout is in the DOM.
                if (tabId === 'home') paintHomeRows();
                else if (tabId === 'past') paintPastRows();
            }

            // ====== HOME TAB ======
            // Two-phase render: layout (cards + searchbar + empty table shell)
            // paints ONCE per tab switch. paintHomeRows() then only updates the
            // tbody innerHTML and the results-count node on every search keystroke
            // or filter change — the input element stays alive so no cursor
            // restoration is needed.
            function renderHomeLayout(rows) {
                if (!rows.length) return renderConfigWarning() +
                    '<div class="empty">No decisions recorded yet.</div>';
                const byDate = groupByDate(rows);
                const latest = byDate[0];
                if (!latest) return renderConfigWarning() +
                    '<div class="empty">No decisions recorded yet.</div>';
                const prev = byDate[1];
                const latestDate = latest[0];
                const latestCount = latest[1].length;
                const dayDiff = prev ? latestCount - prev[1].length : 0;
                const avg = avgDailyApps(byDate);
                const total = rows.length;
                const accepted = rows.filter(r => r._status === 'accepted').length;
                const rejected = rows.filter(r => r._status === 'rejected').length;

                return renderConfigWarning() +
                    readmeSection() +
                    '<div class="latest-date">Latest available data: <strong>' + weekdayLong(latestDate) +
                    '</strong></div>' +
                    '<div class="tracking-since">Tracking started ' + weekdayLong(TRACKING_STARTED) + '</div>' +
                    '<div class="note" style="margin-bottom:16px;">' +
                    '<ul style="margin:0; padding-left:18px; list-style-type: disc;">' +
                    '<li>The latest Excel file from the embassy contains decisions up to <strong>' + weekdayLong(latestDate) + '</strong>. This website includes all decisions recorded up to that date.</li>' +
                    '<li>The Irish Embassy Delhi typically uploads the Excel file at <strong>11:00 AM IST</strong> each day. For the freshest updates, check this page around <strong>11:15 AM IST</strong>.</li>' +
                    '</ul>' +
                    '</div>' +
                    '<div class="searchbar">' + searchIcon() +
                    '<input type="text" id="home-search" placeholder="Search by application number\u2026" value="' +
                    homeSearchTerm + '"></div>' +
                    '<div class="cards">' +
                    '<div class="card"><div class="label">Day-on-day change</div><div class="value ' + (dayDiff >= 0 ?
                        'green' : 'red') + '">' + (dayDiff >= 0 ? '+' : '') + dayDiff + '</div></div>' +
                    '<div class="card"><div class="label">Avg applications/day</div><div class="value">' + avg.toFixed(1) + '</div></div>' +
                    '<div class="card"><div class="label">Acceptance rate</div><div class="value green">' + fmtPct(accepted / total) + '</div></div>' +
                    '<div class="card"><div class="label">Rejection rate</div><div class="value red">' + fmtPct(rejected / total) + '</div></div>' +
                    '</div>' +
                    '<div class="note" id="home-results-count" style="margin-bottom:8px;margin-top:0;"></div>' +
                    '<div class="table-wrap"><table class="results-table"><thead><tr><th>Date</th><th>Application No.</th><th>Decision</th></tr></thead>' +
                    '<tbody id="home-rows"></tbody></table></div>';
            }

            function paintHomeRows() {
                var tbody = document.getElementById('home-rows');
                if (!tbody) return;
                // Disconnect any prior infinite-scroll observer from a previous filter state.
                if (tbody._sentinelObs) { tbody._sentinelObs.disconnect(); tbody._sentinelObs = null; }
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                var rows = cache || [];
                var isSearching = homeSearchTerm.trim().length > 0;
                var visible;
                if (isSearching) {
                    var term = homeSearchTerm.toLowerCase();
                    visible = rows.filter(function(r) { return r.irl.toLowerCase().indexOf(term) !== -1; });
                } else {
                    var byDate = groupByDate(rows);
                    visible = byDate.length ? byDate[0][1] : [];
                }
                var countNote = document.getElementById('home-results-count');
                if (countNote) {
                    if (isSearching) {
                        countNote.textContent = visible.length + ' match(es) for "' + homeSearchTerm + '"';
                    } else {
                        var byDate2 = groupByDate(rows);
                        var lat = byDate2.length ? byDate2[0] : null;
                        countNote.textContent = lat
                            ? ('All results for ' + lat[0] + ' (' + lat[1].length + ' rows)')
                            : '';
                    }
                }
                renderRowsProgressive(tbody, visible);
            }

            function rowHtml(r) { return r._html; }

            // Append a list of rows to a tbody progressively: render first CHUNK
            // synchronously, then use IntersectionObserver to append more chunks as
            // the user scrolls toward the sentinel row. Bounds the initial layout
            // cost so a 5,000-row filter is no heavier than a 100-row one.
            function renderRowsProgressive(tbody, rows) {
                var CHUNK = 100;
                if (!rows.length) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty">No matches.</td></tr>';
                    return;
                }
                if (rows.length <= CHUNK) {
                    tbody.innerHTML = rows.map(function(r) { return r._html; }).join('');
                    return;
                }
                tbody.innerHTML = rows.slice(0, CHUNK).map(function(r) { return r._html; }).join('');
                var sentinel = document.createElement('tr');
                sentinel.className = 'row-sentinel';
                sentinel.innerHTML = '<td colspan="3" style="height:18px;"></td>';
                tbody.appendChild(sentinel);
                var rendered = CHUNK;
                var obs = new IntersectionObserver(function(entries) {
                    if (!entries[0].isIntersecting) return;
                    if (rendered >= rows.length) {
                        sentinel.remove();
                        obs.disconnect();
                        tbody._sentinelObs = null;
                        return;
                    }
                    var next = rows.slice(rendered, rendered + CHUNK);
                    sentinel.insertAdjacentHTML('beforebegin', next.map(function(r) { return r._html; }).join(''));
                    rendered += next.length;
                    if (rendered >= rows.length) {
                        sentinel.remove();
                        obs.disconnect();
                        tbody._sentinelObs = null;
                    }
                }, { rootMargin: '400px' });
                obs.observe(sentinel);
                tbody._sentinelObs = obs;
            }

            function renderDailySummary(rows) {
                if (!rows.length) return renderConfigWarning() +
                    '<div class="empty">No decisions recorded yet.</div>';
                const byDate = groupByDate(rows);
                const trs = byDate.map(([date, dayRows], idx) => {
                    const prevCount = byDate[idx + 1] ? byDate[idx + 1][1].length : null;
                    const diff = prevCount === null ? null : dayRows.length - prevCount;
                    const acc = dayRows.filter(r => classify(r.decision) === 'accepted').length / dayRows.length;
                    const rej = dayRows.filter(r => classify(r.decision) === 'rejected').length / dayRows.length;
                    return '<tr><td class="mono">' + date + '</td><td>' + dayRows.length + '</td><td>' +
                        (diff === null ? '\u2014' : ('<span class="pill ' + (diff >= 0 ? 'green' : 'red') + '">' + (
                            diff >= 0 ? '+' : '') + diff + '</span>')) +
                        '</td><td>' + fmtPct(acc) + '</td><td>' + fmtPct(rej) + '</td></tr>';
                }).join('');
                return renderConfigWarning() +
                    '<div class="table-wrap"><table class="daily-table"><thead><tr><th>Date</th><th>Applications Processed</th><th>Day-on-Day</th><th>Acceptance Rate</th><th>Rejection Rate</th></tr></thead>' +
                    '<tbody>' + trs + '</tbody></table></div>';
            }

            // ====== PAST TAB ======
            // Same layout/rows split as Home: renderPastLayout() paints the cards,
            // filter row, empty tbody shell, and scroll-to-top button ONCE per tab
            // switch. paintPastRows() then only updates the tbody + count note
            // when the date filter changes — the datepicker stays alive so no
            // cursor restoration is needed.
            function renderPastLayout(rows) {
                if (!rows.length) return renderConfigWarning() +
                    '<div class="empty">No decisions recorded yet.</div>';
                const total = rows.length;
                const accepted = rows.filter(r => r._status === 'accepted').length;
                const rejected = rows.filter(r => r._status === 'rejected').length;
                const byDate = groupByDate(rows);
                const avg = avgDailyApps(byDate);
                const thisWeek = rows.filter(r => daysAgo(r.date) < 7).length;
                const lastWeek = rows.filter(r => daysAgo(r.date) >= 7 && daysAgo(r.date) < 14).length;
                const wow = lastWeek ? (thisWeek - lastWeek) / lastWeek : null;

                return renderConfigWarning() +
                    '<div class="cards">' +
                    '<div class="card"><div class="label">Acceptance rate</div><div class="value green">' + fmtPct(accepted / total) + '</div></div>' +
                    '<div class="card"><div class="label">Rejection rate</div><div class="value red">' + fmtPct(rejected / total) + '</div></div>' +
                    '<div class="card"><div class="label">Avg applications/day</div><div class="value">' + avg.toFixed(1) + '</div></div>' +
                    '<div class="card"><div class="label">Week-on-week</div><div class="value ' + (wow === null ? '' : (wow >= 0 ? 'green' : 'red')) + '">' + (wow === null ? '\u2014' : ((wow >= 0 ? '+' : '') + fmtPct(wow))) + '</div></div>' +
                    '</div>' +
                    '<div class="filter-row">' +
                    '<div class="note" style="margin-top:0;">Use the search bar on the Home tab to look up a specific application number.</div>' +
                    '<div class="datefilter' + (pastDateFilter ? ' has-filter' : '') + '"><input type="date" id="past-date-filter" value="' + pastDateFilter + '">' +
                    '<span class="clear-btn" id="past-date-clear" title="Clear date filter">\u00d7</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="note" id="past-results-count" style="margin-bottom:8px;margin-top:0;"></div>' +
                    '<div class="table-wrap"><table class="results-table"><thead><tr><th>Date</th><th>Application No.</th><th>Decision</th></tr></thead>' +
                    '<tbody id="past-rows"></tbody></table></div>' +
                    '<button class="scroll-top-btn" id="scroll-top-btn" title="Scroll to top">\u2191</button>';
            }

            function paintPastRows() {
                var tbody = document.getElementById('past-rows');
                if (!tbody) return;
                if (tbody._sentinelObs) { tbody._sentinelObs.disconnect(); tbody._sentinelObs = null; }
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                var rows = cache || [];
                var visible = pastDateFilter
                    ? rows.filter(function(r) { return r.date === pastDateFilter; })
                    : rows;
                var countNote = document.getElementById('past-results-count');
                if (countNote) {
                    countNote.textContent = pastDateFilter
                        ? (visible.length + ' rows for ' + pastDateFilter)
                        : (visible.length + ' rows total');
                }
                renderRowsProgressive(tbody, visible);
            }

            // ====== SUGGEST TAB ======
            // Two-phase render, same pattern as Home / Past:
            //   renderSuggestLayout()  — paints ONCE per tab switch: form +
            //                            table shell with empty <thead>/<tbody>.
            //                            The submit button + inputs stay alive
            //                            across paints, so typed text and the
            //                            listener are never destroyed on filter
            //                            or post-submit updates.
            //   paintSuggestRows(s)    — updates ONLY #suggest-tbody + thead +
            //                            the empty-state div. No innerHTML
            //                            wipe on the form.
            function renderSuggestLayout() {
                return renderConfigWarning() +
                    '<div class="suggest-grid">' +
                        '<div class="form-col">' +
                            '<div class="card" style="max-width:100%;">' +
                                '<div class="label" style="margin-bottom:12px;">Submit a suggestion</div>' +
                                '<input type="text" id="sugg-name" placeholder="Your name" />' +
                                '<textarea id="sugg-text" placeholder="Your suggestion\u2026"></textarea>' +
                                '<button class="btn" id="sugg-submit">Submit</button>' +
                                '<div class="note" id="sugg-status"></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="table-col">' +
                            '<div class="label" style="margin-bottom:8px;">All suggestions</div>' +
                            '<div class="table-wrap">' +
                                '<table class="suggest-table">' +
                                    '<thead><tr id="suggest-thead-row"></tr></thead>' +
                                    '<tbody id="suggest-tbody"></tbody>' +
                                '</table>' +
                            '</div>' +
                            '<div class="empty" id="suggest-empty" style="padding:20px;">No suggestions yet.</div>' +
                        '</div>' +
                    '</div>';
            }

            function paintSuggestRows(suggestions) {
                var tbody = document.getElementById('suggest-tbody');
                var theadRow = document.getElementById('suggest-thead-row');
                var emptyEl = document.getElementById('suggest-empty');
                if (!tbody) return;
                if (!suggestions || !suggestions.length) {
                    tbody.innerHTML = '';
                    if (theadRow) theadRow.innerHTML = '';
                    if (emptyEl) emptyEl.style.display = '';
                    return;
                }
                if (emptyEl) emptyEl.style.display = 'none';
                var firstKeys = Object.keys(suggestions[0]).filter(function(k) { return k !== '_html' && k !== '_keys'; });
                if (theadRow) theadRow.innerHTML = firstKeys.map(function(h) {
                    return '<th>' + escapeHtml(h) + '</th>';
                }).join('');
                tbody.innerHTML = suggestions.map(function(s) { return s._html; }).join('');
            }

            async function submitSuggestion() {
                const name = document.getElementById('sugg-name').value.trim();
                const suggestion = document.getElementById('sugg-text').value.trim();
                const status = document.getElementById('sugg-status');
                const btn = document.getElementById('sugg-submit');
                if (!name || !suggestion) { status.textContent = 'Please fill in both fields.'; return; }
                if (!WEB_APP_URL) { status.textContent = 'Data source not configured yet.'; return; }
                btn.disabled = true;
                status.textContent = 'Submitting…';
                try {
                    const now = new Date();
                    const timestamp = now.toISOString();
                    const timezone = 'Asia/Kolkata';
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: new URLSearchParams({ name, suggestion, timestamp, timezone })
                    });
                    status.textContent = 'Thanks — suggestion recorded. I\'ll read your suggestion and get back to you.';
                    document.getElementById('sugg-name').value = '';
                    document.getElementById('sugg-text').value = '';
                    suggestionsCache = null;
                    const newSuggestions = await loadSuggestions();
                    const tabBody = document.getElementById('tab-body');
                    if (tabBody && activeTab === 'suggest') {
                        // Don't innerHTML the whole tabBody — the user might
                        // have started typing a new suggestion, and re-binding
                        // the listener manually is fragile.  Just paint the
                        // new rows. The submit button is still the same DOM
                        // node from renderSuggestLayout, with its existing
                        // listener intact.
                        suggestionsCache = newSuggestions;
                        paintSuggestRows(newSuggestions);
                    }
                } catch (err) {
                    status.textContent = 'Could not submit — try again.';
                } finally {
                    btn.disabled = false;
                }
            }

            
            function toggleTheme() {
                theme = theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('visa-theme', theme);
                root.setAttribute('data-theme', theme);
                // Theme switch is instant via CSS variables — no DOM rebuild needed
                var themeToggle = document.getElementById('theme-toggle');
                if (themeToggle) themeToggle.textContent = theme === 'dark' ? '\uD83C\uDF19' : '\u2600\uFE0F';
            }            // Initial mount: build the chrome (eyebrow, title, navpills, hero) and
            // delegate all tab-content rendering to switchTab() so the layout/rows
            // split is the single source of truth.
            async function render() {
                if (!cache) {
                    root.innerHTML = '<div class="eyebrow">Ireland \u00b7 New Delhi Visa Section</div>' +
                        '<div class="titlerow"><h1>Visa Decision Tracker</h1>' +
                        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
                        '<button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">' + (theme === 'dark' ? '🌙' : '☀️') + '</button>' +
                        '<div class="stutter-badge"><i>\u24D8</i> Switching tabs may briefly stutter while data loads.</div></div></div>' +
                        '<div class="topbar"><div class="topbar-fill"></div></div>' +
                        '<div class="navpills">' +
                        '<div class="skel skel-pill"></div><div class="skel skel-pill"></div><div class="skel skel-pill"></div><div class="skel skel-pill"></div>' +
                        '</div>' +
                        '<div class="cards">' +
                        '<div class="skel skel-card" style="grid-column:span 2;animation-delay:0.02s"></div>' +
                        '<div class="skel skel-card" style="animation-delay:0.07s"></div>' +
                        '<div class="skel skel-card" style="animation-delay:0.12s"></div>' +
                        '<div class="skel skel-card" style="animation-delay:0.17s"></div>' +
                        '</div>' +
                        '<div class="skel-wrap">' +
                        '<div class="skel skel-row" style="width:70%"></div>' +
                        '<div class="skel skel-row" style="width:55%"></div>' +
                        '<div class="skel skel-row" style="width:65%"></div>' +
                        '<div class="skel skel-row" style="width:45%"></div>' +
                        '<div class="skel skel-row" style="width:60%"></div>' +
                        '</div>';
                }
                await loadData();
                if (activeTab === 'suggest') await loadSuggestions();

                const tabs = [
                    ['home', 'Home'],
                    ['daily', 'Daily Summary'],
                    ['past', 'Past Results'],
                    ['suggest', 'Suggestions'],
                ];

                const heroState = buildHeroHTML(activeTab, cache || []);

                root.innerHTML =
                    '<div class="eyebrow">Ireland \u00b7 New Delhi Visa Section</div>' +
                    '<div class="titlerow"><h1>Visa Decision Tracker</h1>' +
                    '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
                    '<button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">' + (theme === 'dark' ? '🌙' : '☀️') + '</button>' +
                    '<div class="stutter-badge"><i>\u24D8</i> Switching tabs may briefly stutter while data loads.</div></div>' +
                    '</div>' +
                    '<div class="sub">' + (cache && cache.length ? cache.length + ' decisions on record' :
                        'Awaiting data') + '</div>' +
                    '<div class="navpills">' + tabs.map(([k, label]) => '<div class="navpill ' + (activeTab === k ?
                        'active' : '') + '" data-tab="' + k + '">' + label + '</div>').join('') + '</div>' +
                    '<div class="hero" id="hero" data-id="' + activeTab + '" style="opacity:0">' +
                        '<div class="hero-body">' +
                            '<div>' +
                                '<div class="hero-eyebrow">' + heroState.eyebrow + '</div>' +
                                '<div class="hero-title">' + heroState.title + '</div>' +
                                '<div class="hero-sub">' + heroState.sub + '</div>' +
                            '</div>' +
                            '<div class="visual">' + heroState.visual + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div id="tab-body"></div>';

                tabs.forEach(([k]) => {
                    var pill = root.querySelector('.navpill[data-tab="' + k + '"]');
                    pill.addEventListener('click', function() {
                        // Trigger ripple animation
                        pill.classList.add('rippling');
                        setTimeout(function() { pill.classList.remove('rippling'); }, 520);
                        switchTab(k);
                    });
                });
                const themeToggle = document.getElementById('theme-toggle');
                if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
                morphHero();
                // Initial body paint: populate the active tab's content DIRECTLY
                // without the hero cross-fade dip. morphHero already faded the
                // hero in (opacity 0 → 1), so calling animateHeroSwitch here
                // would briefly dim it back to 0.4 before settling on 1 — a
                // visible flash on first page load. Subsequent tab clicks go
                // through switchTab() which uses the cross-fade as expected.
                var rows = cache || [];
                var tabBody = document.getElementById('tab-body');
                if (tabBody) {
                    if (activeTab === 'home') {
                        tabBody.innerHTML = renderHomeLayout(rows);
                        paintHomeRows();
                    } else if (activeTab === 'daily') {
                        tabBody.innerHTML = renderDailySummary(rows);
                    } else if (activeTab === 'past') {
                        tabBody.innerHTML = renderPastLayout(rows);
                        paintPastRows();
                    } else {
                        tabBody.innerHTML = renderSuggestLayout();
                        paintSuggestRows(suggestionsCache);
                    }
                }
                wireTabListeners();
            }

            root.setAttribute('data-theme', theme);
            render();
        })();
    
    
    </script>
</body>
</html>
