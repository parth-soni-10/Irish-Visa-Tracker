<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irish Visa Decision Tracker</title>
<base target="_blank">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Track Irish embassy visa decisions from New Delhi and Stamp 1G processing dates — searchable history, trends and projections.">
<meta property="og:title" content="Irish Visa Decision Tracker">
<meta property="og:description" content="Daily Irish visa decisions + Stamp 1G processing tracker with trends and projections.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="preload" href="fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
    <div id="visa-dash"></div>
    <!-- Hidden twin of the JS-rendered Suggestions form. The dashboard builds its
         tabs dynamically, so Netlify can't crawl the real form — this static copy
         (same name + fields) is what Netlify's form detector registers at deploy
         time. Submissions are AJAX-posted with form-name=suggestions and land in
         the Netlify dashboard (Forms → Submissions). -->
    <form name="suggestions" netlify netlify-honeypot="bot-field" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true" tabindex="-1">
        <input type="hidden" name="form-name" value="suggestions" />
        <p>
            <label>Name <input type="text" name="name" tabindex="-1" autocomplete="off" /></label>
        </p>
        <p>
            <label>Suggestion <textarea name="suggestion" tabindex="-1"></textarea></label>
        </p>
        <input type="text" name="bot-field" tabindex="-1" autocomplete="off" />
    </form>
    <!-- Same trick for the embassy-visa timeline form: static copy so Netlify
         registers it at deploy time; the live form is JS-rendered on the
         Suggestions tab. -->
    <form name="timelines-visa" netlify netlify-honeypot="bot-field" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true" tabindex="-1">
        <input type="hidden" name="form-name" value="timelines-visa" />
        <input type="hidden" name="tracker" value="visa" />
        <p>
            <label>Applied on <input type="date" name="applied" tabindex="-1" /></label>
        </p>
        <p>
            <label>Decided on <input type="date" name="decided" tabindex="-1" /></label>
        </p>
        <p>
            <label>Outcome <select name="outcome" tabindex="-1"><option value="granted">Granted</option><option value="refused">Refused</option></select></label>
        </p>
        <input type="text" name="bot-field" tabindex="-1" autocomplete="off" />
    </form>
    <!-- 1G-specific timeline form for Netlify registration (live copy is
         JS-rendered on the Stamp 1G page). -->
    <form name="timelines-1g" netlify netlify-honeypot="bot-field" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true" tabindex="-1">
        <input type="hidden" name="form-name" value="timelines-1g" />
        <input type="hidden" name="tracker" value="1g" />
        <p>
            <label>Applied on <input type="date" name="applied" tabindex="-1" /></label>
        </p>
        <p>
            <label>Decided on <input type="date" name="decided" tabindex="-1" /></label>
        </p>
        <p>
            <label>Outcome <select name="outcome" tabindex="-1"><option value="granted">Granted</option><option value="refused">Refused</option></select></label>
        </p>
        <input type="text" name="bot-field" tabindex="-1" autocomplete="off" />
    </form>
    <style>

        /* Self-hosted Geist (variable), the brand font. No Google Fonts
           request at runtime - fonts ship with the site. */
        @font-face { font-family: 'Geist'; src: url('fonts/geist-sans.woff2') format('woff2'); font-weight: 100 900; font-display: swap; font-style: normal; }
        @font-face { font-family: 'Geist Mono'; src: url('fonts/geist-mono.woff2') format('woff2'); font-weight: 100 900; font-display: swap; font-style: normal; }
        #visa-dash * { box-sizing: border-box; }
        #visa-dash {
            /* Single green accent (the brand "approved" color) on slate
               neutrals. Green/red/amber are semantic data states, so they
               stay for status only - decoration uses the one accent. */
            --ink: #333333;
            --ink-soft: #777777;
            --ink-muted: #777777;
            --surface: #ffffff;
            --surface-raised: #f8fafc;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --green: #059669;
            --green-deep: #047857;
            --green-deeper: #065f46;
            --green-light: #10b981;
            --green-soft: #dcfce7;
            --green-text: #166534;
            --amber: #d97706;
            --amber-soft: #fef3c7;
            --amber-text: #92400e;
            --red: #dc2626;
            --red-soft: #fee2e2;
            --red-text: #991b1b;
            /* Radius scale: 14px containers, 6px controls, 999px pills. */
            --r-container: 14px;
            --r-control: 6px;
            font-family: "Inter", "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--surface);
            color: var(--ink);
            min-height: 100vh;
            padding: 24px;
            /* Page-level backstop against horizontal overflow (clip, not
               hidden, so sticky table headers keep working). */
            overflow-x: clip;
            color-scheme: light;
            -webkit-font-smoothing: antialiased;
        }
        #visa-dash .mono { font-family: "Geist Mono", "SF Mono", Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
        /* Interaction polish: kill double-tap zoom delay on controls, set tap
           highlight intentionally, and give every interactive element a
           visible keyboard focus ring. */
        #visa-dash { -webkit-tap-highlight-color: transparent; }
        #visa-dash button, #visa-dash .navpill, #visa-dash tbody tr { touch-action: manipulation; }
        #visa-dash button:focus-visible,
        #visa-dash .navpill:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }
        #visa-dash .clear-btn {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-family: inherit;
        }
        #visa-dash .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 200;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: var(--r-control);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }
        #visa-dash .skip-link:focus {
            left: 16px;
            top: 16px;
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }
        #visa-dash .eyebrow {
            font-size: 12px;
            line-height: 16px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--green);
            font-weight: 500;
            margin-bottom: 4px;
        }
        #visa-dash h1 {
            font-size: 28px;
            margin: 0 0 2px;
            font-weight: 800;
            letter-spacing: -.02em;
            text-wrap: balance;
        }
        #visa-dash .sub {
            color: var(--ink-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }
        #visa-dash .navpills {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        #visa-dash .navpill {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            border: none;
            color: var(--ink-muted);
            background: var(--surface-raised);
            font-family: inherit;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        #visa-dash .navpill::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            opacity: 0;
        }
        #visa-dash .navpill.rippling::after {
            animation: nav-ripple 0.5s ease-out;
        }
        @keyframes nav-ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; }
        }
        #visa-dash .navpill:hover {
            background: var(--surface-hover);
            color: var(--ink-soft);
            transform: translateY(-1px);
        }
        #visa-dash .navpill.active {
            color: #fff;
            background: var(--green-deep);
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.35);
        }
        #visa-dash .navpill.active:hover { background: var(--green-deeper); }
        #visa-dash .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }
        #visa-dash .card {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: var(--r-container);
            padding: 16px;
            opacity: 0;
            transform: translateY(12px);
            animation: visa-card-in 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #visa-dash .card:nth-child(1) { animation-delay: 0.03s; }
        #visa-dash .card:nth-child(2) { animation-delay: 0.08s; }
        #visa-dash .card:nth-child(3) { animation-delay: 0.13s; }
        #visa-dash .card:nth-child(4) { animation-delay: 0.18s; }
        #visa-dash .card:nth-child(5) { animation-delay: 0.23s; }
        #visa-dash .card:nth-child(6) { animation-delay: 0.28s; }
        #visa-dash .card:nth-child(7) { animation-delay: 0.33s; }
        #visa-dash .card:nth-child(8) { animation-delay: 0.38s; }
        @keyframes visa-card-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            #visa-dash .card { animation: none; }
            #visa-dash .ring { opacity: 0; }
        }        #visa-dash .card .label {
            font-size: 12px;
            line-height: 16px;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 8px;
            font-weight: 500;
        }
        #visa-dash .card .value {
            font-size: 18px;
            line-height: 24px;
            font-weight: 600;
            letter-spacing: -0.1px;
            font-variant-numeric: tabular-nums;
            transition: transform 0.15s;
        }
        #visa-dash .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -12px rgba(30, 41, 59, 0.25);
            border-color: #cbd5e1;
        }
        #visa-dash .card:hover .value { transform: scale(1.02); }
        #visa-dash .card .value.green { color: var(--green); }
        #visa-dash .card .value.red { color: var(--red); }
        #visa-dash .card .value.amber { color: var(--amber); }
        #visa-dash .table-wrap {
            overflow-x: auto;
            border-radius: var(--r-container);
            border: 1px solid var(--border);
            background: var(--surface-raised);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }
        #visa-dash table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            min-width: 380px;
        }
        #visa-dash th {
            text-align: left;
            font-size: 12px;
            line-height: 16px;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--ink-muted);
            background: var(--surface-raised);
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            font-weight: 500;
        }
        #visa-dash td {
            padding: 11px 14px;
            font-size: 13.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            color: var(--ink-soft);
            font-variant-numeric: tabular-nums;
        }
        #visa-dash tbody tr {
            transition: background 0.15s;
            content-visibility: auto;
            contain-intrinsic-size: 0 56px;
        }
        /* Hover highlight sits on the first td (not the tr) so it works under
           table-layout:fixed where a tr::before pseudo would generate an
           anonymous table-cell and shift every real td column over by one. */
        #visa-dash tbody tr td:first-child { position: relative; }
        #visa-dash tbody tr td:first-child::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--green), var(--green-light));
            opacity: 0;
            border-radius: 0 3px 3px 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        #visa-dash tbody tr:hover td:first-child::before { opacity: 1; }
        #visa-dash tbody tr:hover {
            background: var(--surface-hover);
        }
        /* Home + Past results tables: 3 columns. Auto layout so the browser
           sizes each column to fit its content (no header collisions across
           the row), and the table takes the full container width on wide
           screen instead of staying centred narrow. min-width keeps narrow
           viewports scrollable rather than squishing columns. */
        #visa-dash .results-table { table-layout: fixed; width: 100%; min-width: 360px; }
        #visa-dash .results-table th, #visa-dash .results-table td { white-space: normal; overflow-wrap: break-word; }
        #visa-dash .results-table th:nth-child(1), #visa-dash .results-table td:nth-child(1) { min-width: 12ch; }
        #visa-dash .results-table th:nth-child(2), #visa-dash .results-table td:nth-child(2) { min-width: 16ch; }
        /* Daily summary table: 5 columns. Same fixed auto-width layout. */
        #visa-dash .daily-table { table-layout: fixed; width: 100%; min-width: 480px; }
        /* (Header no-wrap lives after the column rules below.) */
        #visa-dash .daily-table th, #visa-dash .daily-table td { white-space: normal; overflow-wrap: break-word; }
        #visa-dash .daily-table th:nth-child(1), #visa-dash .daily-table td:nth-child(1),
        #visa-dash .daily-table th:nth-child(2), #visa-dash .daily-table td:nth-child(2),
        #visa-dash .daily-table th:nth-child(3), #visa-dash .daily-table td:nth-child(3),
        #visa-dash .daily-table th:nth-child(4), #visa-dash .daily-table td:nth-child(4),
        #visa-dash .daily-table th:nth-child(5), #visa-dash .daily-table td:nth-child(5) { min-width: 10ch; }
        /* Headers never break mid-word — the wrap scrolls instead. (Placed
           after every table rule: equal specificity means last one wins.
           overflow-wrap MUST reset too: break-word would still force
           emergency mid-word breaks despite nowrap.) */
        #visa-dash .results-table th, #visa-dash .daily-table th { white-space: nowrap; overflow-wrap: normal; }
        /* Daily summary drill-down: each day's date cell toggles a detail row
           listing the applications behind that day's counts. */
        #visa-dash .dd-toggle { cursor: pointer; user-select: none; white-space: nowrap; }
        #visa-dash .dd-toggle:hover { text-decoration: underline; }
        #visa-dash .dd-caret { display: inline-block; width: 1.3em; color: var(--ink-muted); }
        #visa-dash .dd-row { display: none; }
        #visa-dash .dd-row.open { display: table-row; }
        #visa-dash .dd-row td { background: var(--surface-raised); }
        #visa-dash .dd-note { font-size: 12px; color: var(--ink-muted); margin-bottom: 8px; }
        #visa-dash .dd-list { max-height: 240px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 18px; }
        #visa-dash .dd-list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; padding: 1px 0; }
        #visa-dash .dd-list-item .mono { overflow: hidden; text-overflow: ellipsis; }
        /* Sentinel row appended by IntersectionObserver infinite scroll.
           contain-intrinsic-size hints the browser's content-visibility:auto
           layout that the sentinel occupies 18px even before it has been
           laid out, so IO can measure it during fast scrolling. */
        #visa-dash .row-sentinel { contain-intrinsic-size: 0 18px; }
        #visa-dash .row-sentinel td { height: 18px; border-bottom: none; }
        @media (prefers-reduced-motion: reduce) {
            #visa-dash tbody tr { content-visibility: visible; }
        }
        #visa-dash tr:last-child td { border-bottom: none; }
        #visa-dash .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        #visa-dash .pill::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: translateX(-100%) skewX(-20deg);
            transition: transform 0.5s ease;
            pointer-events: none;
        }
        #visa-dash .pill:hover::after {
            transform: translateX(200%) skewX(-20deg);
        }
        #visa-dash .pill.green { background: var(--green-soft); color: var(--green-text); }
        #visa-dash .pill.red { background: var(--red-soft); color: var(--red-text); }
        #visa-dash .pill.amber { background: var(--amber-soft); color: var(--amber-text); }
        /* Placeholder notice rows: dates with no decisions file / office closed.
           Rendered with their real message instead of counting as 1 application. */
        #visa-dash .ph-row td {
            background: var(--amber-soft);
            color: var(--amber-text);
        }
        #visa-dash .ph-msg {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--amber-text);
        }
        #visa-dash .ph-banner {
            background: var(--amber-soft);
            border: 1px solid #fcd34d;
            color: var(--amber-text);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        /* Home status lines: publish-time awareness + "since you last checked". */
        #visa-dash .status-line {
            font-size: 13px;
            color: var(--ink-soft);
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 14px;
            margin-bottom: 12px;
        }
        #visa-dash .status-line.pub-live { background: var(--green-soft); border-color: var(--green-soft); color: var(--green-text); }
        #visa-dash .status-line.pub-late { background: var(--amber-soft); border-color: #fcd34d; color: var(--amber-text); }
        /* Last-known-good offline banner shown when the live refresh failed. */
        #visa-dash .stale-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--amber-soft);
            border: 1px solid #fcd34d;
            color: var(--amber-text);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        #visa-dash .stale-retry {
            flex-shrink: 0;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
        }
        #visa-dash .stale-retry:hover { background: var(--surface-hover); }
        /* Scraper health card (from ?action=meta): last-run status, sheet/file
           reconciliation, and embassy closure dates. */
        #visa-dash .meta-card {
            font-size: 13px;
            color: var(--ink-soft);
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #visa-dash .meta-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        #visa-dash .meta-line strong { color: var(--ink); font-weight: 600; }
        #visa-dash .meta-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        #visa-dash .meta-dot.ok { background: #22c55e; }
        #visa-dash .meta-dot.bad { background: #ef4444; }
        #visa-dash .meta-dot.stale { background: #f59e0b; }
        #visa-dash .closure-chips { display: flex; flex-wrap: wrap; gap: 5px; }
        #visa-dash .closure-chip {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink-soft);
            border: 1px solid var(--border);
        }
        /* Busiest-days heatmap (Daily tab): last 14 weeks, shaded by volume. */
        #visa-dash .heat-wrap { overflow-x: auto; margin-bottom: 16px; }
        #visa-dash .heat-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        #visa-dash .heat-head .note2 { font-size: 12px; color: var(--ink-muted); }
        #visa-dash .heat-grid {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 13px;
            grid-template-rows: repeat(7, 13px);
            gap: 3px;
            width: max-content;
            padding: 2px 0 4px;
        }
        #visa-dash .heat-cell { width: 13px; height: 13px; border-radius: 3px; }
        #visa-dash .heat-0 { background: var(--border); }
        #visa-dash .heat-1 { background: rgba(0, 119, 230, 0.22); }
        #visa-dash .heat-2 { background: rgba(0, 119, 230, 0.45); }
        #visa-dash .heat-3 { background: rgba(0, 119, 230, 0.72); }
        #visa-dash .heat-4 { background: #0077e6; }
        #visa-dash .heat-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-muted); }
        #visa-dash .heat-legend .heat-cell { width: 11px; height: 11px; }
        /* Export CSV button + recent-search chips. */
        #visa-dash .export-btn {
            padding: 0 12px;
            height: 28px;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
        }
        #visa-dash .export-btn:hover { background: var(--surface-hover); }
        #visa-dash .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0 10px;
        }
        #visa-dash .recent-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        #visa-dash .recent-label { font-size: 12px; color: var(--ink-muted); }
        #visa-dash .recent-chip {
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-soft);
            cursor: pointer;
        }
        #visa-dash .recent-chip:hover { background: var(--surface-hover); color: var(--ink); }
        #visa-dash .searchbar {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: var(--r-control);
            padding: 0 12px;
            height: 28px;
            background: var(--surface);
            margin-bottom: 16px;
            max-width: 420px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        #visa-dash .searchbar:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }
        /* Hide Chrome's datalist dropdown arrow on the search box (the
           suggestions still work via typing). All three pseudo-element names
           Chrome has used for it; unknown ones are dropped harmlessly.
           Scoped to #home-search so date inputs keep their indicators. */
        #visa-dash #home-search::-webkit-calendar-picker-indicator,
        #visa-dash #home-search::-webkit-list-button,
        #visa-dash #home-search::picker-icon { display: none; }
        /* Hammer fallback: strip all native decoration from the search box
           itself (its border/background come from .searchbar, so this only
           removes built-in chrome like the datalist arrow). */
        #visa-dash #home-search { -webkit-appearance: none; appearance: none; }
        #visa-dash .searchbar svg {
            flex-shrink: 0;
            opacity: 0.4;
        }
        #visa-dash .searchbar input[type=text] {
            border: none;
            outline: none;
            font-size: 13px;
            line-height: 16px;
            font-weight: 500;
            flex: 1;
            background: transparent;
            color: var(--ink);
            width: auto;
            max-width: none;
            padding: 0;
            margin: 0;
            border-radius: 0;
        }
        #visa-dash .searchbar input[type=text]:focus {
            outline: none;
            box-shadow: none;
        }
        #visa-dash input[type=text] {
            width: 100%;
            max-width: 320px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #visa-dash input[type=text]:focus,
        #visa-dash textarea:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }
        #visa-dash textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            margin-bottom: 12px;
            background: var(--surface);
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #visa-dash input::placeholder,
        #visa-dash textarea::placeholder {
            color: var(--ink-muted);
            opacity: 1;
        }
        #visa-dash .btn {
            /* Emerald-700 base: white text passes WCAG AA (5.5:1). */
            background: var(--green-deep);
            color: #fff;
            border: none;
            padding: 11px 24px;
            border-radius: var(--r-control);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(4, 120, 87, 0.3);
        }
        #visa-dash .btn:hover {
            background: var(--green-deeper);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(4, 120, 87, 0.4);
        }
        #visa-dash .btn:active { transform: scale(0.97); }
        #visa-dash .btn:disabled {
            opacity: .5;
            cursor: default;
            transform: none;
            box-shadow: none;
        }
        #visa-dash .note {
            font-size: 13px;
            color: var(--ink-muted);
            margin-top: 10px;
            line-height: 1.5;
        }
        #visa-dash .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--ink-muted);
            font-size: 14px;
        }
        #visa-dash .config-warn {
            background: var(--amber-soft);
            color: var(--amber-text);
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        #visa-dash .config-warn code {
            background: rgba(0,0,0,.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "Geist Mono", "SF Mono", Consolas, monospace;
            font-size: 12px;
        }
        #visa-dash .datefilter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            border-radius: var(--r-control);
            padding: 0 12px;
            height: 28px;
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        #visa-dash .datefilter:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }
        #visa-dash .datefilter input[type=date] {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            line-height: 16px;
            font-weight: 500;
            color: var(--ink);
            font-family: inherit;
        }
        #visa-dash .datefilter .clear-btn {
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            color: var(--ink-muted);
            transition: color 0.15s;
            visibility: hidden;
        }
        #visa-dash .datefilter.has-filter .clear-btn { visibility: visible; }
        #visa-dash .datefilter .clear-btn:hover { color: var(--red); }
        #visa-dash .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        #visa-dash .filter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        #visa-dash .filter-row .note { margin: 0; }
        #visa-dash .latest-date {
            font-size: 15px;
            margin-bottom: 2px;
            font-weight: 500;
        }
        #visa-dash .tracking-since {
            font-size: 12px;
            color: var(--ink-muted);
            margin-bottom: 16px;
        }
        #visa-dash .topbar {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        #visa-dash .topbar-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 35%;
            background: var(--green);
            border-radius: 2px;
            animation: visa-indeterminate 1.1s ease-in-out infinite;
        }
        @keyframes visa-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(340%); }
        }
        #visa-dash .skel {
            background: linear-gradient(90deg, var(--border) 25%, #f8fafc 37%, var(--border) 63%);
            background-size: 400px 100%;
            animation: visa-shimmer 1.3s ease infinite;
            border-radius: 8px;
        }
        @keyframes visa-shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }
        #visa-dash .skel-pill { height: 34px; width: 90px; border-radius: 100px; }
        #visa-dash .skel-card { height: 72px; border-radius: 14px; opacity: 0; animation: visa-card-in 0.35s ease forwards, visa-shimmer 1.3s ease infinite; }
        #visa-dash .skel-row { height: 16px; margin: 14px 14px; border-radius: 4px; }
        #visa-dash .skel-wrap { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
        #visa-dash #tab-body { animation: visa-fade-in 0.25s ease; scroll-margin-top: 16px; }
        @keyframes visa-fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #visa-dash .readme {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 20px;
            background: var(--surface-raised);
        }
        #visa-dash .readme .readme-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
        }
        #visa-dash .readme p, #visa-dash .readme ul {
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.65;
            margin: 10px 0 0;
        }
        #visa-dash .readme ul {
            padding-left: 18px;
            margin-top: 8px;
        }
        #visa-dash .readme li { margin-bottom: 4px; }
        #visa-dash .readme strong { color: var(--ink); }
        /* Collapsible readme: native marker, pointer cursor, disclosure caret. */
        #visa-dash details.readme > summary { cursor: pointer; list-style: none; }
        #visa-dash details.readme > summary::-webkit-details-marker { display: none; }
        #visa-dash details.readme > summary::before { content: '+ '; color: var(--green); font-weight: 700; }
        #visa-dash details.readme[open] > summary::before { content: '\2212  '; }
        #visa-dash .suggest-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-start;
        }
        #visa-dash .suggest-grid .form-col { flex: 1 1 280px; min-width: 0; }
        /* Netlify-style form: fields wrapped in <p><label>…</label></p>. */
        #visa-dash #sugg-form p { margin: 0 0 12px; }
        #visa-dash #sugg-form label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--ink-muted);
        }
        #visa-dash #sugg-form input[type=text] { margin-bottom: 0; max-width: none; }
        #visa-dash #sugg-form textarea { margin-bottom: 0; }
        /* Post-submit success card: animated checkmark + confirmation. */
        #visa-dash .sugg-success {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 30px 20px;
        }
        #visa-dash .sugg-success .check-wrap { position: relative; width: 66px; height: 66px; }
        #visa-dash .sugg-success .check { width: 66px; height: 66px; position: relative; z-index: 1; }
        /* Sparkle burst behind the checkmark. Each span flies outward along
           its own (--tx, --ty) vector with a per-spark delay (--d). */
        #visa-dash .sugg-success .burst { position: absolute; inset: 0; pointer-events: none; }
        #visa-dash .sugg-success .burst span {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 7px;
            margin: -3px 0 0 -3px;
            opacity: 0;
            animation: spark-pop 0.65s cubic-bezier(.15,.75,.35,1) var(--d, 0s) forwards;
        }
        #visa-dash .sugg-success .burst span.dot { border-radius: 50%; background: var(--green); }
        #visa-dash .sugg-success .burst span.diamond {
            background: var(--amber);
            border-radius: 2px;
            rotate: 45deg; /* separate property: composes with the transform animation */
        }
        @keyframes spark-pop {
            0%   { opacity: 0; transform: translate(0, 0) scale(0.3); }
            18%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.85); }
        }
        #visa-dash .sugg-success .check circle {
            fill: none;
            stroke: var(--green);
            stroke-width: 3;
            stroke-dasharray: 160;
            stroke-dashoffset: 160;
            animation: check-draw 0.5s ease-out forwards;
        }
        #visa-dash .sugg-success .check path {
            fill: none;
            stroke: var(--green);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: check-draw 0.35s ease-out 0.45s forwards;
        }
        @keyframes check-draw { to { stroke-dashoffset: 0; } }
        #visa-dash .sugg-success-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
            animation: visa-fade-in 0.4s ease 0.3s backwards;
        }
        #visa-dash .sugg-success-text {
            font-size: 13px;
            color: var(--ink-muted);
            animation: visa-fade-in 0.4s ease 0.5s backwards;
        }
        #visa-dash .sugg-success .btn {
            margin-top: 8px;
            animation: visa-fade-in 0.4s ease 0.7s backwards;
        }
        #visa-dash .sugg-success .btn:hover { background: var(--green); }
        /* Reduced motion: skip the draw/fade, just show the final state. */
        @media (prefers-reduced-motion: reduce) {
            #visa-dash .sugg-success .check circle,
            #visa-dash .sugg-success .check path,
            #visa-dash .sugg-success-title,
            #visa-dash .sugg-success-text,
            #visa-dash .sugg-success .btn,
            #visa-dash .sugg-success .burst span { animation: none; }
            #visa-dash .sugg-success .burst { display: none; }
            #visa-dash .sugg-success .check circle { stroke-dashoffset: 0; }
            #visa-dash .sugg-success .check path { stroke-dashoffset: 0; }
        }
        #visa-dash .titlerow {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        #visa-dash .titlerow h1 {
            margin: 0 0 2px;
        }
        #visa-dash .stutter-badge {
            background: var(--amber-soft);
            color: var(--amber-text);
            font-size: 11px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            margin-top: 3px;
            border: 1px solid #fcd34d;
        }
        #visa-dash .stutter-badge i {
            font-style: normal;
            font-size: 12px;
        }

        #visa-dash .theme-toggle {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            color: var(--ink-muted);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        #visa-dash .theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--ink);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #visa-dash .theme-toggle svg { display: block; }
        #visa-dash .theme-toggle .icon-moon { display: none; }
        #visa-dash[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
        #visa-dash[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

        /* ===== scroll-to-top button ===== */
        #visa-dash .scroll-top-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-soft);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            visibility: hidden;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }
        #visa-dash .scroll-top-btn.visible {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        #visa-dash .scroll-top-btn:hover {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
            box-shadow: 0 4px 18px rgba(5, 150, 105, 0.35);
            transform: translateY(-2px);
        }
        #visa-dash .scroll-top-btn:active {
            transform: scale(0.92);
        }
        @media (max-width: 760px) {
            #visa-dash .scroll-top-btn {
                bottom: 20px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        /* ===== tracker landing + Stamp 1G =====
           Homescreen with two tracker cards, the 1G hero variant, and the
           projection panel. Reuses .cards/.card/.table-wrap everywhere so
           both trackers share one visual language. */
        #visa-dash .back-btn {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            color: var(--ink-soft);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 100px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #visa-dash .back-btn:hover {
            background: var(--surface-hover);
            color: var(--ink);
            transform: translateY(-1px);
        }
        #visa-dash .tracker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 1080px;
            margin: 20px auto 24px;
        }
        /* Landing fills the viewport height; the header stays at the top
           while the grid grows to fill the rest and centres the cards
           within it. Scoped to the landing wrapper only. */
        #visa-dash .landing-wrap {
            min-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
        }
        #visa-dash .landing-wrap .tracker-grid {
            flex: 1;
            align-content: center;
        }
        #visa-dash .tracker-card {
            font-family: inherit;
            text-align: left;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: var(--r-container);
            padding: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #visa-dash .tracker-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -12px rgba(4, 120, 87, 0.35);
            border-color: var(--green);
        }
        #visa-dash .tracker-card.g1:hover {
            box-shadow: 0 12px 32px -12px rgba(0, 119, 230, 0.4);
            border-color: #0077E6;
        }
        #visa-dash .tracker-card.permits:hover {
            box-shadow: 0 12px 32px -12px rgba(124, 58, 237, 0.4);
            border-color: #7c3aed;
        }
        #visa-dash .tracker-chip {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--green-soft);
            color: var(--green-text);
        }
        #visa-dash .tracker-card.g1 .tracker-chip {
            background: #e3f0fd;
            color: #0077E6;
        }
        #visa-dash[data-theme="dark"] .tracker-card.g1 .tracker-chip {
            background: rgba(0, 119, 230, 0.18);
            color: #7db9f8;
        }
        #visa-dash .tracker-card.permits .tracker-chip {
            background: #ede9fe;
            color: #6d28d9;
        }
        #visa-dash[data-theme="dark"] .tracker-card.permits .tracker-chip {
            background: rgba(124, 58, 237, 0.18);
            color: #c4b5fd;
        }
        #visa-dash .tracker-card h3 {
            margin: 4px 0 0;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--ink);
        }
        #visa-dash .tracker-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.55;
            color: var(--ink-muted);
        }
        #visa-dash .tracker-meta {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--green-text);
        }
        #visa-dash .tracker-card.g1 .tracker-meta { color: #0077E6; }
        #visa-dash[data-theme="dark"] .tracker-card.g1 .tracker-meta { color: #7db9f8; }
        #visa-dash .tracker-card.permits .tracker-meta { color: #6d28d9; }
        #visa-dash[data-theme="dark"] .tracker-card.permits .tracker-meta { color: #c4b5fd; }
        #visa-dash .tracker-cta {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 700;
